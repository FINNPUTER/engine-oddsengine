const ABI=["constructor(address odds,address treasury_,uint256 feeEth_,uint256 feeOdds_)"];
let signer=null;const $=i=>document.getElementById(i);const m=(t,c)=>{$("m").className="m "+(c||"");$("m").innerHTML=t;};
$("c").onclick=async()=>{try{
 if(!window.ethereum){m("No wallet found. Open this page in your wallet browser.","err");return;}
 await window.ethereum.request({method:"eth_requestAccounts"});
 try{await window.ethereum.request({method:"wallet_switchEthereumChain",params:[{chainId:"0x"+CID.toString(16)}]});}

$("d").onclick=async()=>{try{
 $("d").disabled=true;
 const odds=$("odds").value.trim(),tre=$("tre").value.trim()||await signer.getAddress();
