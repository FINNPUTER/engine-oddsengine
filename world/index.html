<style>
:root{--bg:#07040c;--line:rgba(255,255,255,.1);--line2:rgba(255,255,255,.2);--tx:#f2f5f3;--dim:#a9b3ad;--dim2:#6d7772;--g:#22f08a;--g2:#7dffbd;--pink:#ff4fa3;--sun:#ff9a3c;--red:#ff5a4f;--disp:'Unbounded',system-ui,sans-serif;--body:'Instrument Sans',system-ui,-apple-system,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;--ph:0px;--pw:0px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:var(--body);overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;-webkit-user-select:none;user-select:none}
textarea,.log{-webkit-user-select:text;user-select:text}
a{color:var(--g2);text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.glass{background:rgba(10,7,16,.66);backdrop-filter:saturate(170%) blur(16px);-webkit-backdrop-filter:saturate(170%) blur(16px);border:1px solid var(--line)}

/* top */
.top{position:fixed;left:0;right:0;top:0;padding:calc(10px + var(--sat)) 14px 10px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;z-index:20;pointer-events:none}
.top>*{pointer-events:auto}
.who{display:flex;flex-direction:column;gap:8px;min-width:0}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--disp);font-weight:800;font-size:14px;color:var(--tx);min-width:0;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.brand span{white-space:nowrap}
.lv{display:flex;align-items:center;gap:8px;border-radius:99px;padding:5px 11px 5px 6px;width:max-content}
.lv b{font-family:var(--disp);font-size:11px;font-weight:800;background:var(--g);color:#05140b;border-radius:99px;padding:3px 8px;letter-spacing:.02em}
.lv .bar{width:78px;height:5px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden}
.lv .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g),var(--g2));transition:width .6s}
.lv span{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.tr{display:flex;gap:7px;align-items:center;flex:none}
.pill{display:inline-flex;align-items:center;gap:7px;border-radius:99px;padding:0 14px;height:36px;font-size:13px;font-weight:600;white-space:nowrap}
.pill.g{background:var(--g);color:#03130b;border:0}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--g);box-shadow:0 0 10px var(--g)}
.ibtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}

/* minimap */
.osm{position:fixed;left:50%;transform:translateX(-50%);white-space:nowrap;bottom:calc(var(--sab) + 4px);z-index:12;font-size:10px;color:rgba(255,255,255,.45);text-decoration:none;font-family:'JetBrains Mono',monospace}
.mm{position:fixed;z-index:16;width:132px;height:132px;border-radius:50%;overflow:hidden;left:14px;top:calc(96px + var(--sat));border:2px solid rgba(255,255,255,.22);box-shadow:0 6px 24px rgba(0,0,0,.5);background:rgba(8,5,14,.72);touch-action:none}
.mm canvas{width:100%;height:100%;display:block}
@media (min-width:900px){.mm{top:auto;bottom:22px;left:22px;width:168px;height:168px}}

/* banners */
.zb{position:fixed;left:50%;top:calc(64px + var(--sat));transform:translate(calc(-50% - var(--pw)/2),-8px);z-index:15;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;text-align:center;max-width:calc(100vw - 32px)}
.zb.on{opacity:1;transform:translate(calc(-50% - var(--pw)/2),0)}
.zb b{display:block;font-family:var(--disp);font-weight:900;font-style:italic;font-size:clamp(20px,5vw,30px);letter-spacing:-.01em;color:#fff;text-shadow:0 0 18px rgba(255,79,163,.55),0 3px 0 rgba(0,0,0,.6)}
.zb span{display:block;font-size:13px;color:#e6dff0;margin-top:4px;text-shadow:0 1px 8px #000}
.job{position:fixed;left:50%;top:36%;transform:translate(calc(-50% - var(--pw)/2),-50%) scale(.9);z-index:45;text-align:center;pointer-events:none;opacity:0;transition:opacity .35s,transform .35s}
.job.on{opacity:1;transform:translate(calc(-50% - var(--pw)/2),-50%) scale(1)}
.job b{display:block;font-family:var(--disp);font-weight:900;font-style:italic;font-size:clamp(34px,9vw,64px);line-height:1;letter-spacing:-.02em;background:linear-gradient(180deg,#fff 10%,var(--sun) 55%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(0,0,0,.55)) drop-shadow(0 0 22px rgba(255,79,163,.45))}
.job span{display:inline-block;margin-top:10px;font-family:var(--mono);font-weight:700;font-size:15px;color:#05140b;background:var(--g);padding:5px 12px;border-radius:8px}
.job em{display:block;margin-top:8px;font-style:normal;font-size:14px;color:#fff;text-shadow:0 2px 10px #000}

/* bubble */
.bub{position:fixed;left:0;top:0;z-index:14;max-width:min(300px,74vw);transform:translate(-50%,-100%);pointer-events:none;opacity:0;transition:opacity .25s}
.bub.on{opacity:1}
.bub .in{padding:10px 13px;border-radius:16px;font-size:13.5px;line-height:1.45;border:1px solid rgba(34,240,138,.3);box-shadow:0 0 30px rgba(34,240,138,.12)}
.bub .st{font-family:var(--mono);font-size:11.5px;color:var(--g2);display:flex;align-items:center;gap:8px}
.bub button{pointer-events:auto;margin-top:6px;font-size:12px;color:var(--g);font-weight:600}

/* use prompt */
.use{position:fixed;left:50%;bottom:calc(var(--sab) + 26px);transform:translate(-50%,10px);z-index:17;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;display:flex;align-items:center;gap:10px;border-radius:99px;padding:7px 18px 7px 7px;font-weight:600;font-size:14px;white-space:nowrap;max-width:calc(100vw - 32px)}
.use.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.use kbd{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--g);color:#05140b;font-family:var(--mono);font-weight:700;font-size:13px}
.talk{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(var(--sab) + 22px);z-index:17;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:var(--g);color:#05140b;box-shadow:0 8px 30px rgba(34,240,138,.35)}
.talk small{position:absolute;bottom:-18px;font-size:11px;font-weight:600;color:var(--tx);text-shadow:0 1px 6px #000}

/* joystick */
.flyb{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(var(--sab) + 96px);z-index:17;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:rgba(10,7,16,.72);color:var(--g);border:1.5px solid rgba(34,240,138,.55);box-shadow:0 6px 24px rgba(0,0,0,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.flyb small{position:absolute;bottom:-17px;font-size:10.5px;font-weight:700;color:#fff;text-shadow:0 1px 6px #000}
.flyb.on{background:var(--g);color:#05140b}
body.pan .flyb,body.pan .updn,body.pan .homeb{display:none}
.updn{position:fixed;right:calc(84px + env(safe-area-inset-right,0px));bottom:calc(var(--sab) + 22px);z-index:17;display:none;flex-direction:column;gap:10px}
.updn button{width:52px;height:52px;border-radius:50%;background:rgba(10,7,16,.72);border:1.5px solid rgba(255,255,255,.25);color:#fff;font-size:18px;touch-action:none;backdrop-filter:blur(10px)}
body.flying.touch .updn{display:flex}
.homeb{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + var(--sat));z-index:17;display:none;border-radius:99px;padding:8px 16px;font-weight:700;font-size:13px;color:#fff}
body.outside .homeb{display:block}
body.outside .mm{display:none}
.pcard{position:fixed;left:50%;bottom:calc(var(--sab) + 96px);transform:translate(-50%,20px);z-index:40;width:min(340px,calc(100vw - 32px));border-radius:22px;padding:18px;opacity:0;pointer-events:none;transition:.3s;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.pcard.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.pcard img{width:84px;height:84px;border-radius:20px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.pcard h3{margin:0;font-family:var(--disp);font-size:18px}
.pcard p{margin:0;font-size:13.5px;color:#d8d8e0;line-height:1.45}
.pcard .row{display:flex;gap:8px;margin-top:4px}
.joy{position:fixed;left:calc(18px + env(safe-area-inset-left,0px));bottom:calc(var(--sab) + 22px);width:118px;height:118px;border-radius:50%;z-index:16;touch-action:none;display:none}
.joy.on{display:block}
.joy:before{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid var(--line2);background:radial-gradient(circle,rgba(255,79,163,.1),rgba(10,7,16,.5) 70%)}
.joy i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(34,240,138,.22);border:1px solid rgba(34,240,138,.6);box-shadow:0 0 18px rgba(34,240,138,.35)}
body.pan .joy,body.pan .talk,body.pan .use{display:none}

/* panel */
.panel{position:fixed;z-index:18;display:none;flex-direction:column;border-radius:22px 22px 0 0;left:0;right:0;bottom:0;padding:12px 14px calc(12px + var(--sab));max-height:calc(100% - 70px - var(--sat))}
body.pan .panel{display:flex}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line2);margin:0 auto 10px;flex:none}
.ph{display:flex;align-items:center;gap:10px;flex:none;min-width:0}
.ph .zi{width:34px;height:34px;flex:none;border-radius:11px;display:grid;place-items:center;background:rgba(34,240,138,.1);border:1px solid rgba(34,240,138,.3)}
.ph .zt{min-width:0;flex:1}
.ph .zt b{display:block;font-family:var(--disp);font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .zt span{display:block;font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .tg{flex:none;font-size:12px;font-weight:600;color:var(--dim);border:1px solid var(--line2);border-radius:99px;height:30px;padding:0 12px}
.ph .tg.on{color:var(--g);border-color:rgba(34,240,138,.45)}
.ph .x{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center}
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:10px -14px 0;padding:0 14px 2px;flex:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 13px;border-radius:99px;font-size:13px;font-weight:600;border:1px solid var(--line2);background:rgba(255,255,255,.04);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:rgba(34,240,138,.5)}
.chip.l{color:var(--g2)}
.chip.l:after{content:"↗";font-size:11px;opacity:.8}
.log{flex:1;min-height:0;overflow-y:auto;margin:10px -4px 0;padding:0 4px;display:none;overscroll-behavior:contain}
.panel.big .log{display:block}
.m{margin:8px 0;font-size:14px;line-height:1.55;overflow-wrap:anywhere}
.m.u{margin-left:auto;max-width:86%;width:fit-content;background:rgba(34,240,138,.12);border:1px solid rgba(34,240,138,.25);border-radius:16px 16px 4px 16px;padding:8px 12px;white-space:pre-wrap}
.m.a p{margin:0 0 8px}.m.a ul,.m.a ol{margin:0 0 8px 20px}.m.a h2,.m.a h3,.m.a h4{font-family:var(--disp);font-size:14px;margin:10px 0 6px}
.m.a code{font-family:var(--mono);font-size:12.5px;background:rgba(255,255,255,.07);padding:1px 5px;border-radius:5px}
.m.a .tw{overflow-x:auto}.m.a table{border-collapse:collapse;font-size:12.5px;margin:4px 0 8px}.m.a td,.m.a th{border:1px solid var(--line);padding:4px 7px;text-align:left}
.m.a hr{border:0;border-top:1px solid var(--line);margin:10px 0}
.m small{display:block;font-family:var(--mono);font-size:11px;color:var(--dim2);margin-top:2px}
.m .say{font-size:12px;color:var(--g);font-weight:600;margin-top:4px}
.cb{border:1px solid var(--line);border-radius:10px;margin:6px 0;overflow:hidden}.cbh{padding:4px 8px;font-family:var(--mono);font-size:11px;color:var(--dim2);background:rgba(255,255,255,.03)}.cb pre{padding:8px;overflow-x:auto;font-family:var(--mono);font-size:12px}
.card{border:1px solid var(--line2);background:rgba(255,255,255,.035);border-radius:14px;padding:10px 12px;margin:8px 0}
.card pre{white-space:pre-wrap;font-family:var(--mono);font-size:12px;line-height:1.5}
.card .cbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.card .cbs a,.card .cbs button{font-size:12px;font-weight:600;border:1px solid var(--line2);border-radius:99px;padding:6px 11px;color:var(--tx)}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;margin:6px 0}
.imgs img{width:100%;border-radius:10px;display:block}
.steps{font-family:var(--mono);font-size:12px;color:var(--dim)}
.steps div{display:flex;gap:8px;padding:2px 0}.steps .on{color:var(--g2)}
.typing{display:inline-flex;gap:3px;vertical-align:middle}.typing i{width:5px;height:5px;border-radius:50%;background:var(--g);animation:ty 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes ty{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-2px)}}
.hi{color:var(--dim);font-size:13.5px;line-height:1.55;padding:6px 2px}
.form{display:flex;gap:8px;align-items:flex-end;margin-top:10px;flex:none}
.form textarea{flex:1;min-width:0;resize:none;height:46px;max-height:140px;border-radius:16px;border:1px solid var(--line2);background:rgba(0,0,0,.35);color:var(--tx);font:16px/1.4 var(--body);padding:12px 14px;outline:none}
.form textarea:focus{border-color:rgba(34,240,138,.55)}
.form .ib{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line2)}
.form .send{background:var(--g);border:0;color:#03130b}
.form .send.pulse{animation:pu 1.2s infinite}
@keyframes pu{0%{box-shadow:0 0 0 0 rgba(34,240,138,.55)}100%{box-shadow:0 0 0 14px rgba(34,240,138,0)}}
.form .mic.on{background:rgba(255,90,79,.18);border-color:var(--red);color:var(--red)}
.form button:disabled{opacity:.45;cursor:default}
.note{font-size:11.5px;color:var(--dim2);margin-top:8px;flex:none;line-height:1.45}
.gate{margin-top:10px;border:1px solid rgba(34,240,138,.3);background:rgba(34,240,138,.06);border-radius:14px;padding:11px 12px;font-size:13px;color:var(--dim);display:flex;align-items:center;gap:10px;justify-content:space-between;flex:none}
.gate .pill{flex:none}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55)}
.sheet.on{display:flex}
.sheet .in{width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + var(--sab));max-height:84%;overflow-y:auto}
@media (min-width:900px){.sheet{align-items:center}.sheet .in{border-radius:22px}}
.sheet h3{font-family:var(--disp);font-size:16px;margin-bottom:4px}
.sheet p{color:var(--dim);font-size:13px;margin-bottom:12px;line-height:1.5}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{height:32px;padding:0 13px;border-radius:99px;font-size:13px;font-weight:600;border:1px solid var(--line2);color:var(--dim)}
.tabs button.on{background:var(--g);color:#05140b;border-color:var(--g)}
.zl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.zl button{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);border-radius:14px;padding:10px;background:rgba(255,255,255,.03);min-width:0}
.zl button:hover{border-color:rgba(34,240,138,.45)}
.zl b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zl span{display:block;font-size:11.5px;color:var(--dim2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zl i{width:30px;height:30px;flex:none;border-radius:9px;display:grid;place-items:center;background:rgba(34,240,138,.1)}
.zl div{min-width:0}
.jl{display:flex;flex-direction:column;gap:6px}
.jl div{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:12px;font-size:13px}
.jl div i{width:20px;height:20px;border-radius:50%;flex:none;border:1.5px solid var(--line2);display:grid;place-items:center;font-style:normal;font-size:11px}
.jl div.ok i{background:var(--g);border-color:var(--g);color:#05140b}
.jl div span{flex:1;min-width:0}
.jl div em{font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--dim)}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rings button{border:1px solid var(--line);border-radius:14px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;font-weight:600}
.rings button.on{border-color:var(--g)}
.rings button:disabled{opacity:.4;cursor:default}
.rings i{width:34px;height:34px;border-radius:50%;border:5px solid}
.rings small{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.keys{font-family:var(--mono);font-size:11.5px;color:var(--dim2);margin-top:12px;line-height:1.6}

/* overlays */
.ov{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(180deg,#14072a 0%,#3a0d3f 40%,#c2346b 72%,#ff9a3c 100%);text-align:center;padding:24px;transition:opacity .7s}
.ov:after{content:"";position:absolute;inset:auto 0 0 0;height:38%;background:linear-gradient(180deg,transparent,rgba(7,4,12,.95))}
.ov>*{position:relative;z-index:1}
.ov.out{opacity:0;pointer-events:none}
.ov h1{font-family:var(--disp);font-weight:900;font-style:italic;font-size:clamp(34px,9vw,68px);letter-spacing:-.03em;line-height:.95;color:#fff;text-shadow:0 5px 0 rgba(0,0,0,.35),0 0 40px rgba(255,79,163,.6)}
.ov h1 span{color:var(--g);text-shadow:0 5px 0 rgba(0,0,0,.35),0 0 30px rgba(34,240,138,.6)}
.ov p{color:#f7e9f0;max-width:440px;font-size:15px;line-height:1.55}
.ov .bar{width:180px;height:4px;border-radius:4px;background:rgba(255,255,255,.25);overflow:hidden}
.ov .bar i{display:block;height:100%;width:0;background:var(--g);box-shadow:0 0 10px var(--g);transition:width .3s}

<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {EXRLoader} from 'three/addons/loaders/EXRLoader.js';
import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

/* ================= basics, same session as the app ================= */
const API = window.ODDSENGINE_API || '';
const $ = s => document.querySelector(s);
const E = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let ADMIN = ''; try { const q = new URLSearchParams(location.search).get('admin'); if (q) { localStorage.setItem('oe_admin', q); history.replaceState(null, '', location.pathname); } ADMIN = localStorage.getItem('oe_admin') || ''; } catch (e) {}
let TOKEN = ''; try { TOKEN = localStorage.getItem('oe_engine') || ''; } catch (e) {}
let TG_INIT = ''; try { TG_INIT = (window.Telegram && Telegram.WebApp && Telegram.WebApp.initData) || ''; if (!TG_INIT) { const m = (location.hash || '').match(/tgWebAppData=([^&]*)/); if (m) TG_INIT = decodeURIComponent(m[1]); } } catch (e) {}
function hdr() { const h = {'Content-Type': 'application/json'}; if (ADMIN) h['X-OddsEngine-Admin'] = ADMIN; if (TOKEN) h['X-OddsEngine-Key'] = TOKEN; return h; }
async function api(p, opt) {
  const r = await fetch(API + p, Object.assign({headers: hdr()}, opt || {}));
  let j = null; try { j = await r.json(); } catch (e) {}
  if (!r.ok) { const m = (j && (j.detail || (j.error && j.error.message))) || ('error ' + r.status); const er = new Error(m); er.status = r.status; er.body = j; throw er; }
  return j;
}
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), 2800); }
const usd = v => '$' + (v < 0.01 ? v.toFixed(4) : v < 1 ? v.toFixed(3) : v.toFixed(2));
const TOUCH = matchMedia('(pointer:coarse)').matches;
const WIDE = () => innerWidth >= 900;
const REDUCED = matchMedia('(prefers-reduced-motion:reduce)').matches;
const bootBar = v => { const b = $('#bootBar'); if (b) b.style.width = Math.round(v * 100) + '%'; };
const ls = {get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }};

/* tiny safe markdown, same rules as the app */
function md(src) {
  src = String(src || ''); const blocks = [];
  src = src.replace(/```([\w+-]*)\n?([\s\S]*?)(```|$)/g, (m, lang, code) => { blocks.push({lang, code}); return '\u0000' + (blocks.length - 1) + '\u0000'; });
  let h = E(src);
  const inl = t => t.replace(/`([^`\n]+)`/g, '<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>').replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<i>$2</i>')
    .replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener nofollow">$1</a>');
  const lines = h.split('\n'); let out = '', list = null, para = [];
  const flushP = () => { if (para.length) { out += '<p>' + inl(para.join('<br>')) + '</p>'; para = []; } };
  const flushL = () => { if (list) { out += `<${list.t}>` + list.items.map(x => '<li>' + inl(x) + '</li>').join('') + `</${list.t}>`; list = null; } };
  for (let i = 0; i < lines.length; i++) { const l = lines[i]; let mt;
    if (/^\u0000\d+\u0000$/.test(l.trim())) { flushP(); flushL(); out += l.trim(); continue; }
    if (/^\s*\|.*\|\s*$/.test(l) && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])) { flushP(); flushL();
      const row = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => inl(c.trim())); const head = row(l); i++; const body = [];
      while (i + 1 < lines.length && /^\s*\|.*\|\s*$/.test(lines[i + 1])) { i++; body.push(row(lines[i])); }
      out += '<div class="tw"><table><tr>' + head.map(c => '<th>' + c + '</th>').join('') + '</tr>' + body.map(r => '<tr>' + r.map(c => '<td>' + c + '</td>').join('') + '</tr>').join('') + '</table></div>'; continue; }
    if ((mt = l.match(/^(#{1,4})\s+(.*)$/))) { flushP(); flushL(); const n = Math.min(4, mt[1].length + 1); out += `<h${n}>${inl(mt[2])}</h${n}>`; continue; }
    if ((mt = l.match(/^\s*[-*•]\s+(.*)$/))) { flushP(); if (!list || list.t !== 'ul') { flushL(); list = {t: 'ul', items: []}; } list.items.push(mt[1]); continue; }
    if ((mt = l.match(/^\s*\d+[.)]\s+(.*)$/))) { flushP(); if (!list || list.t !== 'ol') { flushL(); list = {t: 'ol', items: []}; } list.items.push(mt[1]); continue; }
    if (/^\s*(---|\*\*\*)\s*$/.test(l)) { flushP(); flushL(); out += '<hr>'; continue; }
    if (!l.trim()) { flushP(); flushL(); continue; }
    if (list && /^\s{2,}/.test(l)) { list.items[list.items.length - 1] += ' ' + l.trim(); continue; }
    flushL(); para.push(l); }
  flushP(); flushL();
  return out.replace(/\u0000(\d+)\u0000/g, (m, i) => { const b = blocks[+i]; return `<div class="cb"><div class="cbh">${E(b.lang || 'code')}</div><pre><code>${E(b.code.replace(/\n$/, ''))}</code></pre></div>`; });
}
const plain = t => String(t || '').replace(/\n\s*[-*•]\s+/g, ' · ').replace(/```[\s\S]*?```/g, ' ').replace(/[*_`#>|]/g, '').replace(/\[([^\]]+)\]\([^)]+\)/g, '$1').replace(/\s+/g, ' ').trim();

/* ================= icons ================= */
const ICON = {

  weather: c => { c.arc(0, 0, .6, 0, 6.3); c.stroke(); c.beginPath(); c.ellipse(0, 0, .25, .6, 0, 0, 6.3); c.stroke(); c.beginPath(); c.moveTo(-.6, 0); c.lineTo(.6, 0); c.moveTo(-.5, -.32); c.lineTo(.5, -.32); c.moveTo(-.5, .32); c.lineTo(.5, .32); c.stroke(); },
  crypto: c => { [[-.5, .1, .35], [-.15, -.35, .3], [.2, -.05, .45], [.55, -.5, .25]].forEach(([x, y, h]) => { c.beginPath(); c.moveTo(x, y - .12); c.lineTo(x, y + h + .12); c.stroke(); c.strokeRect(x - .09, y, .18, h); }); },
  scan: c => { c.moveTo(-.55, .65); c.lineTo(-.55, -.6); c.lineTo(.55, -.6); c.lineTo(.55, .65); c.stroke(); c.beginPath(); c.moveTo(-.4, .05); c.lineTo(.4, .05); c.stroke(); },
  trail: c => { const p = [[-.55, .4], [-.1, -.35], [.25, .25], [.6, -.45]]; c.beginPath(); p.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.stroke(); p.forEach(([x, y]) => { c.beginPath(); c.arc(x, y, .11, 0, 6.3); c.fill(); }); },
  vault: c => { c.arc(0, 0, .6, 0, 6.3); c.stroke(); c.beginPath(); c.arc(0, 0, .18, 0, 6.3); c.stroke(); for (let i = 0; i < 4; i++) { const a = i * 1.57 + .78; c.beginPath(); c.moveTo(Math.cos(a) * .18, Math.sin(a) * .18); c.lineTo(Math.cos(a) * .45, Math.sin(a) * .45); c.stroke(); } },
  trade: c => { c.moveTo(-.3, .55); c.lineTo(-.3, -.5); c.moveTo(-.55, -.25); c.lineTo(-.3, -.55); c.lineTo(-.05, -.25); c.moveTo(.3, -.55); c.lineTo(.3, .5); c.moveTo(.05, .25); c.lineTo(.3, .55); c.lineTo(.55, .25); c.stroke(); },
  studio: c => { c.strokeRect(-.62, -.35, .9, .7); c.beginPath(); c.moveTo(.28, -.12); c.lineTo(.62, -.32); c.lineTo(.62, .32); c.lineTo(.28, .12); c.stroke(); },
  desk: c => { c.moveTo(-.42, .3); c.lineTo(-.42, -.05); c.quadraticCurveTo(-.42, -.55, 0, -.55); c.quadraticCurveTo(.42, -.55, .42, -.05); c.lineTo(.42, .3); c.lineTo(.52, .4); c.lineTo(-.52, .4); c.closePath(); c.stroke(); c.beginPath(); c.arc(0, .52, .1, 0, 3.14); c.stroke(); },
  burn: c => { c.moveTo(0, .65); c.quadraticCurveTo(-.55, .55, -.45, .05); c.quadraticCurveTo(-.35, -.3, -.1, -.65); c.quadraticCurveTo(0, -.2, .2, -.25); c.quadraticCurveTo(.5, .05, .45, .3); c.quadraticCurveTo(.4, .62, 0, .65); c.stroke(); },
  radar: c => { c.arc(0, 0, .6, 0, 6.3); c.stroke(); c.beginPath(); c.arc(0, 0, .32, 0, 6.3); c.stroke(); c.beginPath(); c.moveTo(0, 0); c.lineTo(.42, -.42); c.stroke(); c.beginPath(); c.arc(.25, .3, .07, 0, 6.3); c.fill(); }
};
function iconImg(k, s) {
  const cv = document.createElement('canvas'); cv.width = cv.height = 64; const c = cv.getContext('2d');
  c.translate(32, 32); c.scale(22, 22); c.lineWidth = .11; c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = c.fillStyle = '#5dffa8';
  c.beginPath(); (ICON[k] || ICON.core)(c);
  return `<img src="${cv.toDataURL()}" width="${s || 20}" height="${s || 20}" alt="">`;
}

/* ================= stations: every tool is a machine =================
   chip: [label, text, kind f = put in the box, l = open a page, flag in 4th] */
const H = Math.PI / 2;
const ST_LIST = [
  {id: 'core', t: 'The Dock', use: 'Plug in', s: 'Ask anything. Markets, wallets, coins, news, your day.', icon: 'core', x: 0, z: -8.6, f: 0, r: 1.9,
   chips: [['What can you do?', 'What can you do for me?', 'f'], ['Brief me', 'Give me my briefing now', 'f'], ['My memory', 'What do you remember about me?', 'f']]},
  {id: 'weather', t: 'Weather Globe', use: 'Spin the globe', s: 'Temperature calls on Polymarket and Kalshi, every hit and miss.', icon: 'weather', x: -15.2, z: -6.5, f: H, r: 1.6,
   chips: [["Today's calls", "What are today's weather calls?", 'f'], ['Yesterday', "How did yesterday's weather calls do, hits and misses?", 'f'], ['Kalshi', 'Show me the Kalshi weather calls', 'f'], ['Weather app', 'https://public.oddsengine.live/', 'l']]},
  {id: 'crypto', t: 'Crypto Desk', use: 'Take a seat', s: 'Up and Down markets for the big coins, engine odds against the book.', icon: 'crypto', x: -15.2, z: 0.5, f: H, r: 1.8,
   chips: [['Right now', 'What does the crypto engine see right now on BTC and ETH?', 'f'], ['Stock tokens', 'Which Robinhood stock tokens are moving today?', 'f'], ['Terminal', 'https://terminal.oddsengine.live/', 'l']]},
  {id: 'trade', t: 'Trade Terminal', use: 'Pull the lever', s: 'Trade by text or voice. You confirm every trade in your own wallet.', icon: 'trade', x: -15.2, z: 7, f: H, r: 1.3,
   chips: [['Trade by text', 'Buy $5 of ODDS', 'f', 'trade']]},
  {id: 'trail', t: 'Heist Board', use: 'Follow the strings', s: 'Where the money came from, where it went, who else is in.', icon: 'trail', x: 16.6, z: -6.5, f: -H, r: 1.2,
   chips: [['Follow the money', 'Where did the money of this wallet come from: 0x…', 'f'], ['Explain a wallet', 'Explain this wallet: 0x…', 'f'], ['Explain a transaction', 'Explain this transaction: 0x…', 'f']]},
  {id: 'scan', t: 'Scanner Gate', use: 'Run a scan', s: 'Any coin, facts straight from the chain. Dev, bundles, holders, locks.', icon: 'scan', x: 13.6, z: 0.5, f: -H, r: 1.6,
   chips: [['Scan a coin', 'Scan this coin: 0x…', 'f'], ['New launches', 'What launched on Torch in the last hour?', 'f'], ['Launch Board', '/launches/', 'l']]},
  {id: 'vault', t: 'The Vault', use: 'Open the vault', s: 'Your portfolio across chains, approvals, take profit alerts.', icon: 'vault', x: 16.7, z: 7, f: -H, r: 1.2,
   chips: [['My portfolio', 'Show my portfolio', 'f'], ['Wallet check', 'Check my wallet for risky approvals', 'f'], ['Take profit', 'Alert me when my ODDS bag hits 3x', 'f']]},
  {id: 'studio', t: 'Studio', use: 'Roll camera', s: 'Images and short videos from the best models.', icon: 'studio', x: -11, z: 10.2, f: Math.PI, r: 1.6,
   chips: [['Image', 'Make me an image of a neon robot reading a price chart at sunset', 'f'], ['Video', 'Make a 5 second video of a neon robot walking down a palm lined street at sunset', 'f'], ['All models', '/#chat', 'l']]},
  {id: 'desk', t: 'Daily Desk', use: 'Read the paper', s: 'Your brief, reminders, watched pages and deals.', icon: 'desk', x: -3.6, z: 10.4, f: Math.PI, r: 1.7,
   chips: [['Brief me', 'Give me my briefing now', 'f'], ['Reminder', 'Remind me tomorrow 9:00 to check the calls', 'f'], ['Watch a page', 'Watch this page for changes: https://…', 'f'], ['Deals', 'Find me a deal on AirPods Pro 3', 'f', 'deals']]},
  {id: 'burn', t: 'Burn Barrel', use: 'Feed the fire', s: '$ODDS burns and the OddsEngine Locker on Robinhood Chain.', icon: 'burn', x: 4, z: 10.4, f: Math.PI, r: 1.5,
   chips: [['Burns', 'How much $ODDS and $TORCH is burned?', 'f'], ['Burn page', 'https://public.oddsengine.live/burn', 'l'], ['Locker', '/lock/', 'l', 'locker']]},
  {id: 'radar', t: 'GTA Radar', use: 'Watch the radar', s: 'Every new GTA coin, the moment it launches.', icon: 'radar', x: 11.2, z: 10.4, f: Math.PI, r: 1.4,
   chips: [['Radar on', 'Tell me when new GTA coins launch', 'f'], ['Today', 'Which GTA coins launched today?', 'f'], ['GTA VI tracker', '/gta/', 'l']]}
];
ST_LIST.forEach(s => { s.dx = Math.sin(s.f); s.dz = Math.cos(s.f); s.sx = s.x + s.dx * (s.r + 1.2) + s.dz * 1.5; s.sz = s.z + s.dz * (s.r + 1.2) - s.dx * 1.5; });

/* ================= state ================= */
const ST = {feat: {}, preview: false, me: null, agent: null, busy: false, log: [], cur: ST_LIST[0], using: null, steps: null, poll: 0, ring: 'idle', voice: 0, near: null};

/* ================= progress: jobs, XP, rings ================= */
const RINGS = [
  {id: 'green', n: 'Engine Green', c: 0x22f08a, css: '#22f08a', lv: 1},
  {id: 'cyan', n: 'Ocean Drive', c: 0x3de8ff, css: '#3de8ff', lv: 2},

  {id: 'white', n: 'Ice', c: 0xe8fff4, css: '#e8fff4', lv: 6}
];
const XP_LV = 150, LV_MAX = 6;
let PG = null, PKEY = '';
function pgKey() { const a = ST.me && ST.me.address; return 'oe_hq_' + (a ? a.toLowerCase() : 'guest'); }
function pgLoad() {
  const k = pgKey(); if (k === PKEY && PG) return; const guest = ls.get('oe_hq_guest', null);

    const face = (ax, az, sp2) => { const want = Math.atan2(ax - bot.position.x, az - bot.position.z); let dA = want - bot.rotation.y; dA = Math.atan2(Math.sin(dA), Math.cos(dA)); bot.rotation.y += dA * Math.min(1, dt * sp2); };
    if (hs > (P.fly ? 1.2 : .3)) { P.still = 0; const want = Math.atan2(P.vel.x, P.vel.z); let dA = want - bot.rotation.y; dA = Math.atan2(Math.sin(dA), Math.cos(dA)); bot.rotation.y += dA * Math.min(1, dt * 12); }
    else { P.still += dt; if (P.fly || !IN) {} else if (ST.using) { if (ST.ring === 'idle') face(ST.using.x, ST.using.z, 6); else face(cam.position.x, cam.position.z, 4); } else if (P.still > .8 || ST.ring !== 'idle') face(cam.position.x, cam.position.z, 4); }
    // walk cycle from the avatar's own animation, stop on the feet-together frame
    const rn = Math.min(1, sp / 3.2);
    if (AV.walk) {
      if (rn > .08) { AV.walk.paused = false; AV.stopping = false; AV.walk.timeScale = Math.max(.6, sp / 2.2); }
      else if (!AV.walk.paused) { AV.walk.timeScale = 1.1; const ph = ((AV.walk.time - .6) % .7 + .7) % .7; if (ph < .05 || ph > .67) AV.walk.paused = true; }
      AV.mix.update(dt);
      if (AV.walk.paused && AV.spine) AV.spine.rotation.x += Math.sin(t * 1.8) * .025;
      if (AV.head) { AV.head.rotation.x += ST.ring === 'thinking' ? Math.sin(t * 3) * .08 - .05 : 0; AV.head.rotation.z += ST.ring === 'listening' ? Math.sin(t * 1.5) * .12 : 0; }
    }
    // the ring and the glowing lines
    let pw = 1;
    if (ST.ring === 'speaking' && performance.now() > (ST.speakUntil || 0)) ST.ring = 'idle';
    if (ST.ring === 'idle') pw = .9 + .25 * (.5 + .5 * Math.sin(t * 1.6));
    if (ST.ring === 'listening') pw = 1.3 + .8 * Math.abs(Math.sin(t * 11) * Math.sin(t * 4.3));
    if (ST.ring === 'thinking') pw = 1.1 + .9 * Math.abs(Math.sin(t * 6));
    if (ST.ring === 'speaking') pw = 1 + 1.1 * Math.abs(Math.sin(t * 9) * Math.sin(t * 3.7));
    if (ST.ring === 'voice') pw = 1 + 2 * ST.voice;
    AV.pow.value = pw; faceLight.intensity = .8 + pw * 1.6;
    // machines
    let near = null, nd = 99;
    for (const s of ST_LIST) { s.anim(t, ST.using === s); const d = Math.hypot(bot.position.x - s.sx, bot.position.z - s.sz); if (IN && bot.position.y < .5 && d < 2.1 && d < nd) { nd = d; near = s; } const want = (near === s || ST.using === s) ? .55 : (P.autoUse === s ? .35 : .12 + .06 * Math.sin(t * 2 + s.x)); s.mark.material.opacity += (want - s.mark.material.opacity) * Math.min(1, dt * 6); }
    if (near !== ST.near) { ST.near = near; if (near) { sfx('near'); award('seen', near.id, 20, 'Found', near.t); } }
    let pn = null; if (!IN && window.__partners) for (const q of window.__partners) { if (Math.hypot(bot.position.x - q.x, bot.position.z - q.z) < 3.2 && bot.position.y < q.gy + 3) pn = q; }
    if (pn !== ST.pnear) { ST.pnear = pn; if (pn) { sfx('near'); award('fly', 'p_' + pn.p.id, 25, pn.p.name, 'You found their house in Shibuya'); } else hidePartner(); }
    const showUse = !!(near && !ST.using && !P.autoUse) || !!(pn && !$('#pcard').classList.contains('on'));
    if (showUse) { $('#useT').textContent = near ? near.use + ' · ' + near.t : 'Enter · ' + pn.p.name; }
    $('#use').classList.toggle('on', showUse);
    neonL.intensity = 16 + Math.sin(t * 3.1) * 1.2 + (Math.random() < .004 ? -10 : 0);
    // tap ping
    const pa = (t - pingT) / .7; if (pa < 1) { pingM.material.opacity = .8 * (1 - pa); pingM.scale.setScalar(1 + pa * 2.5); } else pingM.material.opacity = 0;
    // camera
    const ip = intro < 1 ? 1 - Math.pow(1 - intro, 3) : 1; if (intro < 1) intro = Math.min(1, intro + dt / 2.8);
    if (ST.using) {
      const s = ST.using; const side = .35;
      camPos.set(s.x + s.dx * (s.r + 4.8) - s.dz * .9 * side * 3, 3.1, s.z + s.dz * (s.r + 4.8) + s.dx * .9 * side * 3); look.set(s.x * .8 + s.sx * .2, 1.9, s.z * .8 + s.sz * .2);
    } else {
      if (P.vel.length() > 1 && !drag && TOUCH) { let dA = (bot.rotation.y + Math.PI) - P.yaw; dA = Math.atan2(Math.sin(dA), Math.cos(dA)); P.yaw += dA * dt * .6; }
      P.camOut += ((P.fly || !IN ? 5.5 : 0) - P.camOut) * Math.min(1, dt * 2); const dist = P.dist + (1 - ip) * 9 + P.camOut, pit = P.pitch + (1 - ip) * .25, yaw = P.yaw + (1 - ip) * .9;
      camPos.set(bot.position.x + Math.sin(yaw) * Math.cos(pit) * dist, bot.position.y + 2 + Math.sin(pit) * dist, bot.position.z + Math.cos(yaw) * Math.cos(pit) * dist);
      look.set(bot.position.x, bot.position.y + 2, bot.position.z);
    }
    if (IN) { camPos.x = Math.max(X0 + .5, Math.min(X1 - .5, camPos.x)); camPos.z = Math.max(Z0 + .5, Math.min(Z1 - .5, camPos.z)); camPos.y = Math.max(1, Math.min(HT - .6, camPos.y)); }
    else camPos.y = Math.max(floorAt(camPos) + .8, camPos.y);
    if (first) { cam.position.copy(camPos); lookS.copy(look); } else { cam.position.lerp(camPos, 1 - Math.pow(ST.using ? .02 : .002, dt)); lookS.lerp(look, 1 - Math.pow(.004, dt)); }
    if (P.shake > 0) { P.shake -= dt; cam.position.x += (Math.random() - .5) * P.shake * .8; cam.position.y += (Math.random() - .5) * P.shake * .8; }
    cam.lookAt(lookS);
    if (window.__cine) { const c = window.__cine(t); if (c) { cam.position.set(c[0], c[1], c[2]); cam.lookAt(c[3], c[4], c[5]); lookS.set(c[3], c[4], c[5]); } }
    key.position.set(cam.position.x + 3, cam.position.y + 4, cam.position.z + 2);
    for (const a of anims) a(t);
    if (COMP) COMP.render(dt); else R.render(S, cam);
    drawMap();
    // bubble follows the head
    head3.set(bot.position.x, bot.position.y + 3.25, bot.position.z).project(cam);
    const bub = $('#bub'); bub.style.visibility = (!WIDE() && document.body.classList.contains('pan')) ? 'hidden' : '';
    if (head3.z < 1) { const r = cv.getBoundingClientRect(); const by = Math.max((-head3.y * .5 + .5) * r.height, bub.offsetHeight + 70); bub.style.transform = `translate(${(head3.x * .5 + .5) * r.width}px,${by}px) translate(-50%,-100%)`; }
    // keep it smooth on weak phones
    fpsN++; fpsT += dt; if (fpsT > 3 && !window.__rec) { const fps = fpsN / fpsT; if (fps < 32 && DPR > 1) { DPR = Math.max(1, DPR - .3); R.setPixelRatio(DPR); view(); lowSeen++; } else if (fps < 26 && COMP && lowSeen > 1 && TOUCH) { COMP = null; } fpsN = 0; fpsT = 0; }
    if (first) { first = false; bootBar(1); setTimeout(() => $('#boot').classList.add('out'), 300); setTimeout(() => { const h = $('#hint'); h.textContent = TOUCH ? 'Walk to a machine, or tap it to go there' : 'WASD to walk, E to use a machine, or just click it'; h.classList.remove('out'); setTimeout(() => h.classList.add('out'), 5200); }, 2600); }
  }
  requestAnimationFrame(frame);
}
