<style>
:root{
  --bg:#030605;--card:rgba(255,255,255,.04);--card2:rgba(255,255,255,.07);--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);
  --tx:#ecf5ef;--dim:#9fb2a7;--dim2:#62756a;--g:#22f08a;--g2:#7dffbd;--red:#ff5d6c;--amber:#ffb547;
  --disp:'Unbounded',system-ui,sans-serif;--body:'Instrument Sans',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--body);font-size:15px;line-height:1.5;overflow-x:clip;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
a{color:var(--g2);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
.mono{font-family:var(--mono)}
.wrap{max-width:1140px;margin:0 auto;padding:0 16px}
.aurora{position:fixed;inset:-20vh -10vw auto -10vw;height:90vh;z-index:0;pointer-events:none;filter:blur(70px);opacity:.55}
.aurora i{position:absolute;border-radius:50%;mix-blend-mode:screen;animation:drift 22s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:55vw;height:40vh;left:5vw;top:8vh;background:radial-gradient(closest-side,rgba(34,240,138,.5),transparent)}
.aurora i:nth-child(2){width:45vw;height:38vh;right:0;top:0;background:radial-gradient(closest-side,rgba(20,140,255,.26),transparent);animation-duration:28s}
.aurora i:nth-child(3){width:40vw;height:30vh;left:35vw;top:22vh;background:radial-gradient(closest-side,rgba(167,139,250,.2),transparent);animation-duration:34s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(6vw,4vh) scale(1.15)}100%{transform:translate(-4vw,-2vh) scale(.95)}}
.grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.35;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse at 50% 0%,#000 30%,transparent 75%)}
main,header,footer{position:relative;z-index:1}

.nav{position:sticky;top:10px;z-index:30;display:flex;align-items:center;gap:8px;margin:10px auto 0;max-width:1140px;width:calc(100% - 32px);padding:7px 7px 7px 14px;background:rgba(8,14,11,.72);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border:1px solid var(--line);border-radius:999px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--disp);font-weight:700;font-size:12.5px;letter-spacing:.05em;color:var(--tx);white-space:nowrap}
.brand svg{flex:none}
.tabs{display:flex;gap:2px;margin:0 auto;padding:3px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.tabs button{border:0;background:none;cursor:pointer;padding:8px 14px;border-radius:999px;color:var(--dim);font-weight:600;font-size:13px;white-space:nowrap;min-height:36px}
.tabs button.on{background:var(--g);color:#02130a}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:10px 16px;border-radius:999px;border:1px solid var(--line2);background:var(--card2);color:var(--tx);font-family:var(--disp);font-weight:700;font-size:11.5px;letter-spacing:.04em;cursor:pointer;white-space:nowrap;transition:transform .15s,box-shadow .25s}
.btn:hover{transform:translateY(-1px)}
.btn-g{background:var(--g);color:#02130a;border-color:transparent}
.btn-g:hover{box-shadow:0 8px 30px rgba(34,240,138,.35)}
.btn-sm{min-height:36px;padding:8px 12px;font-size:10.5px}
.btn-red{color:var(--red);border-color:rgba(255,93,108,.35);background:rgba(255,93,108,.06)}
#walletBtn{flex:none}
@media (max-width:640px){
  .brand span{display:none}
  .tabs{margin:0 auto 0 4px}
  .tabs button{padding:8px 11px;font-size:12.5px}
  #walletBtn{padding:8px 11px;font-size:10px;min-height:36px}
}

.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:24px;align-items:center;padding:46px 0 18px}
@media (max-width:860px){.hero{grid-template-columns:1fr;padding-top:26px}.hero .face{order:-1;max-width:300px;margin:0 auto}}
.eyebrow{display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.eyebrow b{color:var(--g);font-weight:500}
h1{font-family:var(--disp);font-weight:800;font-size:clamp(34px,6vw,64px);line-height:1.02;letter-spacing:-.015em;margin:14px 0 14px}
h2{font-family:var(--disp);font-weight:700;font-size:clamp(20px,3vw,26px);letter-spacing:-.01em;margin:6px 0 6px}
.shiny{background:linear-gradient(110deg,#e9fff3 30%,#22f08a 45%,#d6ffe9 52%,#7dffbd 60%,#e9fff3 75%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
@keyframes shine{0%{background-position:120% 0}100%{background-position:-120% 0}}
.lead{color:var(--dim);font-size:17px;max-width:560px;margin:0 0 18px}
.face{position:relative;width:100%;max-width:400px;justify-self:end}
.face svg{width:100%;height:auto;display:block;border-radius:30px}
.face .st{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--g);background:rgba(3,6,5,.7);border:1px solid rgba(34,240,138,.35);padding:5px 11px;border-radius:999px;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--dim)}
.chip .d{width:8px;height:8px;border-radius:50%;background:var(--dim2)}
.chip.ok{color:var(--tx)}.chip.ok .d{background:var(--g);box-shadow:0 0 10px var(--g)}

.card{position:relative;border-radius:22px;background:var(--card);border:1px solid var(--line);padding:20px;overflow:hidden}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(420px circle at var(--mx,50%) var(--my,-30%),rgba(34,240,138,.10),transparent 45%);opacity:0;transition:opacity .3s}
.card:hover::before{opacity:1}
.card h3{font-family:var(--disp);font-size:15px;font-weight:700;margin:0 0 4px;letter-spacing:.01em}
.card .sub{color:var(--dim);font-size:13.5px;margin:0 0 14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
section{padding:14px 0}

.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.steps{grid-template-columns:1fr}}
.step{display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:18px;background:rgba(255,255,255,.03);border:1px solid var(--line)}
.step .n{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:13px;border:1px solid var(--line2);color:var(--dim)}
.step.done .n{background:var(--g);color:#02130a;border-color:transparent}
.step b{display:block;font-size:14.5px}.step span{color:var(--dim);font-size:13px}
.step .btn{margin-top:10px}

.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .l{min-width:0}.row .l b{display:block;font-size:14.5px;font-weight:600}.row .l span{color:var(--dim);font-size:12.5px}
.sw{position:relative;flex:none;width:48px;height:28px;border-radius:999px;background:rgba(255,255,255,.12);border:0;cursor:pointer;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.sw::before{content:"";position:absolute;inset:-9px -6px}
.sw.on{background:var(--g)}.sw.on::after{transform:translateX(20px);background:#02130a}
.mem{display:flex;flex-direction:column;gap:8px;margin-top:10px;max-height:300px;overflow:auto;padding-right:2px}
.mem .it{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid var(--line)}
.mem .it p{margin:0;font-size:14px;min-width:0;overflow-wrap:anywhere}
.mem .it small{display:block;color:var(--dim2);font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.x{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--dim);cursor:pointer;font-size:16px;line-height:1}
.x:hover{color:var(--red);border-color:rgba(255,93,108,.4)}
.addrow{display:flex;gap:8px;margin-top:12px}
.addrow input{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid var(--line2);background:rgba(0,0,0,.3);padding:0 12px;outline:none}
.addrow input:focus{border-color:rgba(34,240,138,.5)}
.wl{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.wl:first-child{border-top:0}
.wl .ch{flex:none;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;padding:4px 8px;border-radius:999px;border:1px solid var(--line2);color:var(--dim)}
.wl .ad{flex:1;min-width:0;font-family:var(--mono);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.big{font-family:var(--disp);font-weight:800;font-size:clamp(30px,5vw,42px);letter-spacing:-.02em}
.big small{font-family:var(--mono);font-size:13px;color:var(--dim);font-weight:500;letter-spacing:0;margin-left:6px}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--g2));border-radius:99px}
.note{color:var(--dim2);font-size:12.5px}
.dep{margin-top:12px;padding:12px;border-radius:14px;background:rgba(34,240,138,.06);border:1px dashed rgba(34,240,138,.35);font-size:13.5px;color:var(--dim)}
.dep code{display:block;margin-top:6px;font-family:var(--mono);font-size:12.5px;color:var(--tx);overflow-wrap:anywhere}

.keys .k{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.keys .k:first-child{border-top:0}
.keys .k code{flex:1;min-width:0;font-family:var(--mono);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.keys .k span{color:var(--dim);font-size:12px;white-space:nowrap}
.newkey{display:none;margin-top:12px;padding:12px;border-radius:14px;background:rgba(255,181,71,.08);border:1px solid rgba(255,181,71,.35);font-size:13px;color:var(--amber)}
.newkey code{display:block;color:var(--tx);font-family:var(--mono);font-size:12.5px;margin-top:6px;overflow-wrap:anywhere}
.pg{display:flex;flex-direction:column;gap:10px}
.pg select{height:44px;border-radius:12px;border:1px solid var(--line2);background:rgba(0,0,0,.35);padding:0 12px;outline:none;width:100%}
.pg .log{min-height:220px;max-height:380px;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:16px;background:rgba(0,0,0,.28);border:1px solid var(--line)}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;font-size:14.5px;line-height:1.45;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:#1b6b45}
.msg.ai{align-self:flex-start;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.msg.ai small{display:block;font-family:var(--mono);font-size:10.5px;color:var(--dim2);margin-top:4px}
.pg form{display:flex;gap:8px}
.pg textarea{flex:1;min-width:0;height:48px;max-height:140px;resize:none;border-radius:14px;border:1px solid var(--line2);background:rgba(0,0,0,.3);padding:12px;outline:none}
.models{display:flex;flex-direction:column;margin-top:10px;max-height:360px;overflow:auto}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.mrow:first-child{border-top:0}
.mrow b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow span{font-family:var(--mono);font-size:12px;color:var(--dim);white-space:nowrap}
.mrow .tag{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--g);border:1px solid rgba(34,240,138,.35);border-radius:999px;padding:2px 7px;margin-left:6px}
@media (max-width:520px){.mrow{grid-template-columns:minmax(0,1fr) auto}.mrow .out{display:none}}
pre{margin:10px 0 0;padding:14px;border-radius:14px;background:rgba(0,0,0,.4);border:1px solid var(--line);font-family:var(--mono);font-size:12.5px;line-height:1.55;overflow:auto;color:#cfe}

.soon{text-align:center;padding:60px 0 30px}
.soon .face{margin:0 auto 10px;justify-self:center}
.admin-bar{position:fixed;left:0;right:0;bottom:0;z-index:99;background:#ffb547;color:#1a1000;font:12px/1.4 var(--mono);padding:7px 14px;text-align:center}
footer{padding:36px 0 50px;color:var(--dim2);font-size:12.5px}
footer a{color:var(--dim)}
.rv{opacity:0;transform:translateY(14px);transition:opacity .7s ease,transform .7s ease}
.rv.in{opacity:1;transform:none}
.d1{transition-delay:.08s}.d2{transition-delay:.16s}.d3{transition-delay:.24s}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}.aurora i,.shiny{animation:none}}
.spark{position:fixed;pointer-events:none;z-index:200;width:6px;height:6px;border-radius:50%;background:var(--g2)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;z-index:150;background:rgba(8,14,11,.92);border:1px solid rgba(34,240,138,.4);color:var(--tx);padding:10px 16px;border-radius:999px;font-size:13.5px;transition:all .3s;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}


/* ---------- 2.29: OddsEngine AI ---------- */
.acct{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.acct{grid-template-columns:1fr}}
.credit{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.credit .big{line-height:1}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.kv div{padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid var(--line);min-width:0}
.kv span{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim2)}
.kv b{display:block;font-family:var(--mono);font-size:14px;font-weight:500;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addr{display:flex;align-items:center;gap:8px;margin-top:8px;padding:10px 10px 10px 12px;border-radius:14px;background:rgba(0,0,0,.35);border:1px solid var(--line2)}
.addr code{flex:1;min-width:0;font-family:var(--mono);font-size:12.5px;color:var(--tx);overflow-wrap:anywhere;line-height:1.4}
.copy{flex:none;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid rgba(34,240,138,.45);background:rgba(34,240,138,.08);color:var(--g);font-family:var(--mono);font-size:11.5px;cursor:pointer}
.howto{margin:12px 0 0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:8px}
.howto li{counter-increment:s;display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--dim)}
.howto li::before{content:counter(s);flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:11px;color:#02130a;background:var(--g);margin-top:1px}
.howto b{color:var(--tx);font-weight:600}
.deps{margin-top:12px;display:flex;flex-direction:column}
.deps .d{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.deps .d:first-child{border-top:0}
.deps .d span{color:var(--dim);font-family:var(--mono);font-size:12px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.deps .d b{font-family:var(--mono);font-weight:500;color:var(--g);white-space:nowrap}
.cta-connect{display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.hint{font-size:12.5px;color:var(--dim2);margin-top:8px}
.linkbox{margin-top:12px;padding:12px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid var(--line)}
.linkbox p{margin:0 0 6px;font-size:13px;color:var(--dim)}

/* playground */
.pgtop{display:flex;gap:8px;align-items:center}
.pgtop select{flex:1;min-width:0}
.pg .log{min-height:260px;max-height:440px}
.msg.ai .cost{display:inline-block;margin-left:8px;color:var(--g)}
.msg.err{align-self:flex-start;background:rgba(255,93,108,.08);border:1px solid rgba(255,93,108,.35);color:#ffb3ba}
.typing{display:inline-flex;gap:4px;padding:4px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--g);opacity:.4;animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{50%{opacity:1;transform:translateY(-3px)}}
.pgfoot{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:11px;color:var(--dim2)}

/* quickstart */
.qtabs{display:flex;gap:4px;margin-top:12px;padding:3px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid var(--line);width:max-content;max-width:100%}
.qtabs button{border:0;background:none;color:var(--dim);font-family:var(--mono);font-size:12px;padding:7px 12px;border-radius:999px;cursor:pointer;min-height:34px}
.qtabs button.on{background:rgba(34,240,138,.15);color:var(--g)}
pre{white-space:pre;max-width:100%}
.base{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12.5px;color:var(--dim)}
.base code{font-family:var(--mono);color:var(--tx);overflow-wrap:anywhere;min-width:0}

/* models */
.mtools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.mtools input{flex:1 1 220px;min-width:0;height:44px;border-radius:12px;border:1px solid var(--line2);background:rgba(0,0,0,.3);padding:0 12px;outline:none}
.mtools select{height:44px;border-radius:12px;border:1px solid var(--line2);background:rgba(0,0,0,.35);padding:0 10px;outline:none;flex:0 0 auto}
.fchips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.fchips::-webkit-scrollbar{display:none}
.fchips button{flex:none;border:1px solid var(--line2);background:var(--card);color:var(--dim);border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer;min-height:36px;white-space:nowrap}
.fchips button.on{background:var(--g);border-color:transparent;color:#02130a;font-weight:600}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:12px}
.mc{position:relative;display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:18px;background:rgba(255,255,255,.03);border:1px solid var(--line);min-width:0;transition:border-color .2s,transform .2s}
.mc:hover{border-color:rgba(34,240,138,.35);transform:translateY(-2px)}

/* ---------- own dialog instead of the browser's grey confirm() ---------- */
function ask(text,o){o=o||{};return new Promise(res=>{
  const d=document.createElement('div');d.className='oeask';
  d.innerHTML=`<div class="oeask-bg"></div><div class="oeask-box" role="dialog" aria-modal="true" aria-labelledby="oeaskT"><div class="oeask-ring"></div><h3 id="oeaskT">${E(o.title||'Are you sure?')}</h3><p>${E(text)}</p><div class="oeask-btns"><button class="btn" data-k="0">${E(o.cancel||'Cancel')}</button><button class="btn ${o.danger?'btn-red':'btn-g'}" data-k="1">${E(o.ok||'OK')}</button></div></div>`;
  document.body.appendChild(d);requestAnimationFrame(()=>d.classList.add('on'));
  const done=v=>{d.classList.remove('on');document.removeEventListener('keydown',kd);setTimeout(()=>d.remove(),200);res(v);};
  const kd=e=>{if(e.key==='Escape')done(false);if(e.key==='Enter')done(true);};
  document.addEventListener('keydown',kd);
  d.querySelector('.oeask-bg').onclick=()=>done(false);
  d.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>done(b.dataset.k==='1'));
  setTimeout(()=>d.querySelector('[data-k="1"]').focus(),30);
});}
let ADMIN='';try{const q=new URLSearchParams(location.search).get('admin');if(q){localStorage.setItem('oe_admin',q);history.replaceState(null,'',location.pathname+location.hash);}ADMIN=localStorage.getItem('oe_admin')||'';}catch(e){}

async function api(p,opt){const r=await fetch(API+p,Object.assign({headers:hdr()},opt||{}));let j=null;try{j=await r.json();}catch(e){}
  if(!r.ok){const m=(j&&(j.detail||(j.error&&j.error.message)))||('error '+r.status);const er=new Error(m);er.status=r.status;throw er;}return j;}

/* ---------- the living ring ---------- */
function face(state){return `<div class="face rv"><svg id="av" viewBox="0 0 400 400" aria-label="The Engine">
<defs><filter id="gl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<image href="robot-ring.webp" x="0" y="0" width="400" height="400"/>
<g id="eye"><circle id="halo" cx="203.9" cy="151.4" r="52.5" fill="none" stroke="#2ef08c" stroke-opacity=".18" stroke-width="22" filter="url(#gl)"/>
<circle id="ring" cx="203.9" cy="151.4" r="52.5" fill="none" stroke="#5dffa8" stroke-width="6" stroke-linecap="round" stroke-dasharray="300 30" filter="url(#gl)"/>
<circle id="inner" cx="203.9" cy="151.4" r="40" fill="none" stroke="#2ef08c" stroke-opacity="0" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="40 211"/></g></svg>
<div class="st" id="faceSt">${E(state||'idle')}</div></div>`;}
let RING={state:'idle',a1:0,a2:0,lv:0,ex:0,ey:0,tx:0,ty:0,last:0};
addEventListener('pointermove',e=>{const av=$('#av');if(!av)return;const r=av.getBoundingClientRect();RING.tx=Math.max(-1,Math.min(1,(e.clientX-(r.left+r.width*.51))/r.width))*6;RING.ty=Math.max(-1,Math.min(1,(e.clientY-(r.top+r.height*.38))/r.height))*4;});
(function loop(t){const dt=Math.min(50,t-RING.last)/1000;RING.last=t;
  const ring=$('#ring'),halo=$('#halo'),inner=$('#inner'),eye=$('#eye');
  if(ring){let w=6,ho=.18,sp=26,io=0;
    if(RING.state==='idle'){const b=.5+.5*Math.sin(t/650);w=5.6+.9*b;ho=.12+.12*b;}
    if(RING.state==='listening'){const g=Math.abs(Math.sin(t/90)*Math.sin(t/233)+.35*Math.sin(t/57));RING.lv+=(g-RING.lv)*.25;w=5.5+5*RING.lv;ho=.15+.35*RING.lv;}
    if(RING.state==='thinking'){w=5.2+1.2*Math.sin(t/120);ho=.22;sp=260;io=.7;}
    RING.a1=(RING.a1+sp*dt)%360;RING.a2=(RING.a2-170*dt)%360;RING.ex+=(RING.tx-RING.ex)*.12;RING.ey+=(RING.ty-RING.ey)*.12;
    eye.setAttribute('transform',`translate(${RING.ex.toFixed(2)} ${RING.ey.toFixed(2)})`);
    ring.setAttribute('transform',`rotate(${RING.a1.toFixed(1)} 203.9 151.4)`);inner.setAttribute('transform',`rotate(${RING.a2.toFixed(1)} 203.9 151.4)`);
    inner.setAttribute('stroke-opacity',io);ring.setAttribute('stroke-width',w.toFixed(2));halo.setAttribute('stroke-opacity',ho.toFixed(3));}
  requestAnimationFrame(loop);})(0);
function setRing(s){RING.state=s;const el=$('#faceSt');if(el)el.textContent=s;}

function tierStats(f){const v=MODELS.filter(f).map(m=>m.kind==='image'?m.per_image:m.per_msg).filter(x=>x!=null).sort((a,b)=>a-b);if(!v.length)return null;return {lo:v[0],hi:v[v.length-1],mid:v[Math.floor(v.length/2)],n:v.length};}
function cents(v){return v<0.01?usd(v,v<0.001?4:3):usd(v,v<0.1?3:2);}
function perDollar(v){const n=1/v;return n>=1000?Math.round(n/100)*100:n>=100?Math.round(n/10)*10:Math.max(1,Math.round(n));}

function replay(){const log=$('#pgLog');if(!log||!CHAT.length)return;log.innerHTML=CHAT.map(c=>c.role==='user'?`<div class="msg me">${E(c.content)}</div>`:`<div class="msg ai">${E(c.content)}<small>${E(c.model||'')}${c.cost!=null?`<span class="cost">${usd(c.cost,4)}</span>`:''}</small></div>`).join('');log.scrollTop=log.scrollHeight;}
async function send(text){
  const log=$('#pgLog');const sel=$('#pgModel');const model=sel.value;const mname=modelName(model);
  if(!connected()){toast('Connect your wallet first');return;}
  CHAT.push({role:'user',content:text});
  log.insertAdjacentHTML('beforeend',`<div class="msg me">${E(text)}</div>`);
  const out=document.createElement('div');out.className='msg ai';out.innerHTML='<span class="typing"><i></i><i></i><i></i></span>';log.appendChild(out);log.scrollTop=log.scrollHeight;setRing('thinking');
  if(DEMO){await new Promise(r=>setTimeout(r,700));const t='This is the preview. Live answers from '+mname+' show up here once you are connected.';out.innerHTML=E(t)+`<small>${E(mname)}</small>`;CHAT.push({role:'assistant',content:t,model:mname});setRing('idle');return;}
  let txt='',cost=null,errMsg=null;
  try{
    const r=await fetch(API+'/v1/ai/chat',{method:'POST',headers:hdr(),body:JSON.stringify({model,stream:true,messages:CHAT.filter(c=>c.role).slice(-20).map(c=>({role:c.role,content:c.content}))})});
    if(!r.ok){let j=null;try{j=await r.json();}catch(e){}throw new Error((j&&(j.detail||(j.error&&j.error.message)))||('error '+r.status));}
    const rd=r.body.getReader();const dec=new TextDecoder();let buf='';
    for(;;){const {value,done}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
      while((i=buf.indexOf('\n\n'))>=0){const ev=buf.slice(0,i);buf=buf.slice(i+2);
        for(const line of ev.split('\n')){if(!line.startsWith('data: '))continue;const d=line.slice(6).trim();if(d==='[DONE]')continue;let j;try{j=JSON.parse(d);}catch(e){continue;}
          if(j.error){errMsg=j.error.message;continue;}
          const dl=j.choices&&j.choices[0]&&j.choices[0].delta;if(dl&&dl.content){txt+=dl.content;out.innerHTML=E(txt);log.scrollTop=log.scrollHeight;}
          if(j.usage&&j.usage.oddsengine_charged_usd!=null)cost=j.usage.oddsengine_charged_usd;}}}
    if(errMsg&&!txt)throw new Error(errMsg);
  }catch(e){out.className='msg err';out.textContent=e.message||'Something went wrong';CHAT.pop();setRing('idle');
    if(/balance/i.test(e.message||''))$('#account').scrollIntoView({behavior:'smooth'});return;}
  out.innerHTML=E(txt||'(empty answer)')+`<small>${E(mname)}${cost!=null?`<span class="cost">${usd(cost,4)}</span>`:''}</small>`;
  CHAT.push({role:'assistant',content:txt,model:mname,cost});setRing('idle');
  if(cost!=null&&ME&&ME.balance){ME.balance.usd=Math.max(0,(ME.balance.usd||0)-cost);ME.balance.spent=(ME.balance.spent||0)+cost;const pc=$('#pgCost');if(pc)pc.textContent='Last reply '+usd(cost,4)+' · balance '+usd(ME.balance.usd);}
}

/* --- tiny safe markdown --- */
function md(src){
  src=String(src||'');const blocks=[];
  src=src.replace(/```([\w+-]*)\n?([\s\S]*?)(```|$)/g,(m,lang,code)=>{blocks.push({lang,code});return '\u0000'+(blocks.length-1)+'\u0000';});
  let h=E(src);
  const inl=t=>t.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/(^|[\s(])\*([^*\n]+)\*/g,'$1<i>$2</i>')
    .replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener nofollow">$1</a>');
  const lines=h.split('\n');let out='',list=null,para=[];
  const flushP=()=>{if(para.length){out+='<p>'+inl(para.join('<br>'))+'</p>';para=[];}};
  const flushL=()=>{if(list){out+=`<${list.t}>`+list.items.map(x=>'<li>'+inl(x)+'</li>').join('')+`</${list.t}>`;list=null;}};
  for(let i=0;i<lines.length;i++){const l=lines[i];
    if(/^\u0000\d+\u0000$/.test(l.trim())){flushP();flushL();out+=l.trim();continue;}
    if(/^\s*\|.*\|\s*$/.test(l)&&i+1<lines.length&&/^\s*\|?\s*:?-{2,}/.test(lines[i+1])){flushP();flushL();
      const row=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>inl(c.trim()));const head=row(l);i++;const body=[];
      while(i+1<lines.length&&/^\s*\|.*\|\s*$/.test(lines[i+1])){i++;body.push(row(lines[i]));}
      out+='<div class="tw"><table><tr>'+head.map(c=>'<th>'+c+'</th>').join('')+'</tr>'+body.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</table></div>';continue;}
    let mt;
    if((mt=l.match(/^(#{1,4})\s+(.*)$/))){flushP();flushL();out+=`<h${Math.min(4,mt[1].length+1)}>${inl(mt[2])}</h${Math.min(4,mt[1].length+1)}>`;continue;}
    if((mt=l.match(/^\s*[-*•]\s+(.*)$/))){flushP();if(!list||list.t!=='ul'){flushL();list={t:'ul',items:[]};}list.items.push(mt[1]);continue;}
    if((mt=l.match(/^\s*\d+[.)]\s+(.*)$/))){flushP();if(!list||list.t!=='ol'){flushL();list={t:'ol',items:[]};}list.items.push(mt[1]);continue;}
    if(/^\s*(---|\*\*\*)\s*$/.test(l)){flushP();flushL();out+='<hr>';continue;}
    if(!l.trim()){flushP();flushL();continue;}
    if(list&&/^\s{2,}/.test(l)){list.items[list.items.length-1]+=' '+l.trim();continue;}
    flushL();para.push(l);}
  flushP();flushL();
  return out.replace(/\u0000(\d+)\u0000/g,(m,i)=>{const b=blocks[+i];return `<div class="cb"><div class="cbh"><span>${E(b.lang||'code')}</span><button class="cbc" data-code="${i}">Copy</button></div><pre><code>${E(b.code.replace(/\n$/,''))}</code></pre></div>`;})
;
}

async function chatSend(text){
  if(CH.busy)return;
  if(!connected()){connect();return;}
  const m=chatModel();

    if(!r.ok){let j=null;try{j=await r.json();}catch(e){}throw new Error((j&&((j.error&&j.error.message)||j.detail))||('error '+r.status));}
    if(m.kind==='image'){const j=await r.json();Object.assign(a,j,{pending:false});}
    else{
      const rd=r.body.getReader();const dec=new TextDecoder();let buf='',err=null;a.pending=false;
      for(;;){const {value,done}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
        while((i=buf.indexOf('\n\n'))>=0){const ev=buf.slice(0,i);buf=buf.slice(i+2);
          for(const line of ev.split('\n')){if(!line.startsWith('data: '))continue;const d=line.slice(6).trim();if(d==='[DONE]')continue;let j;try{j=JSON.parse(d);}catch(e){continue;}
            if(j.error){err=j.error.message;continue;}
            const dl=j.choices&&j.choices[0]&&j.choices[0].delta;if(dl&&dl.content){a.content+=dl.content;const el=box();if(el){const mdel=el.querySelector('.md');if(mdel){mdel.innerHTML=md(a.content);}}if(CH.stick)scrollChat();}
            if(j.usage&&j.usage.oddsengine_charged_usd!=null)a.cost=j.usage.oddsengine_charged_usd;}}}
      if(err&&!a.content)throw new Error(err);

  }catch(e){
    if(e.name==='AbortError'){a.pending=false;if(!a.content)a.content='(stopped)';}
    else{a.err=true;a.pending=false;a.content=e.message||'Something went wrong';if(!a.content.length)a.content='Something went wrong';CH.msgs=CH.msgs.filter(x=>x!==a);CH.msgs.push(a);}
  }

  const it=CH.list.find(c=>c.id===CH.cur);if(it)it.updated=new Date().toISOString();
  render();scrollChat();
  if(a.err&&/balance/i.test(a.content||''))toast('Top up in Account');
}

    if(k==='new'){if(CH.busy)return;CH.cur=null;CH.msgs=[];CH.drawer=false;render();setTimeout(()=>{const t=$('#cIn');if(t)t.focus();},50);}

/* =================== 2.35: own dropdowns and wallet picker =================== */
/* Every <select> on the page becomes our own dropdown. The real select stays hidden
   underneath, so all existing onchange handlers keep working. */
(function(){
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  function closeAll(except){document.querySelectorAll('.oesel.open').forEach(w=>{if(w!==except&&w._shut)w._shut();});}
  function enh(s){
    if(s._oe||s.closest('.oesel'))return;s._oe=1;
    const w=document.createElement('div');
    w.className='oesel'+[...s.classList].filter(c=>c!=='oesel-n').map(c=>' '+c).join('');
    const b=document.createElement('button');b.type='button';b.className='oesel-b';
    b.setAttribute('aria-haspopup','listbox');b.setAttribute('aria-expanded','false');
    if(s.getAttribute('aria-label'))b.setAttribute('aria-label',s.getAttribute('aria-label'));
    const l=document.createElement('div');l.className='oesel-l';l.setAttribute('role','listbox');
    s.parentNode.insertBefore(w,s);w.appendChild(s);w.appendChild(b);w.appendChild(l);
    s.classList.add('oesel-n');s.tabIndex=-1;s.setAttribute('aria-hidden','true');
    let hi=s.selectedIndex;
    const sync=()=>{const o=s.options[s.selectedIndex];b.innerHTML=`<span>${o?esc(o.text):''}</span><i aria-hidden="true"></i>`;};
    const build=()=>{l.innerHTML=[...s.options].map((o,i)=>`<div role="option" class="oesel-o${i===s.selectedIndex?' on':''}${i===hi?' hi':''}${o.disabled?' off':''}" data-i="${i}" aria-selected="${i===s.selectedIndex}"><span>${esc(o.text)}</span>${i===s.selectedIndex?'<em aria-hidden="true">✓</em>':''}</div>`).join('');
      const h=l.querySelector('.hi')||l.querySelector('.on');if(h)h.scrollIntoView({block:'nearest'});};
    const place=()=>{const r=b.getBoundingClientRect();const up=innerHeight-r.bottom<280&&r.top>innerHeight-r.bottom;
      const wd=Math.max(r.width,220);let x=r.right-wd;if(x<8)x=Math.min(r.left,innerWidth-wd-8);
      l.style.left=Math.max(8,x)+'px';l.style.width=wd+'px';
      if(up){l.style.top='';l.style.bottom=(innerHeight-r.top+8)+'px';l.style.maxHeight=Math.min(300,r.top-16)+'px';}
      else{l.style.bottom='';l.style.top=(r.bottom+8)+'px';l.style.maxHeight=Math.min(300,innerHeight-r.bottom-16)+'px';}
      l.classList.toggle('up',up);};
    const open=()=>{closeAll(w);hi=s.selectedIndex;build();document.body.appendChild(l);place();w.classList.add('open');requestAnimationFrame(()=>l.classList.add('open'));b.setAttribute('aria-expanded','true');};
    const shut=()=>{w.classList.remove('open');l.classList.remove('open');b.setAttribute('aria-expanded','false');setTimeout(()=>{if(!w.classList.contains('open')&&l.parentNode===document.body)w.appendChild(l);},180);};
    w._shut=shut;
    const pick=i=>{const o=s.options[i];if(!o||o.disabled)return;if(i!==s.selectedIndex){s.selectedIndex=i;s.dispatchEvent(new Event('input',{bubbles:true}));s.dispatchEvent(new Event('change',{bubbles:true}));}sync();shut();b.focus();};
    b.addEventListener('click',e=>{e.stopPropagation();w.classList.contains('open')?shut():open();});
    l.addEventListener('click',e=>{e.stopPropagation();const o=e.target.closest('.oesel-o');if(o)pick(+o.dataset.i);});
    b.addEventListener('keydown',e=>{
      const isOpen=w.classList.contains('open');const n=s.options.length;
      if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!isOpen){open();return;}hi=Math.max(0,Math.min(n-1,hi+(e.key==='ArrowDown'?1:-1)));build();}
      else if(e.key==='Enter'||e.key===' '){e.preventDefault();isOpen?pick(hi):open();}
      else if(e.key==='Escape'){shut();}
      else if(e.key==='Tab'){shut();}
    });
    s.addEventListener('change',sync);
    new MutationObserver(sync).observe(s,{childList:true,subtree:true,attributes:true});
    sync();
  }
  document.addEventListener('click',()=>closeAll());
  addEventListener('resize',()=>closeAll());
  addEventListener('scroll',e=>{if(e.target&&e.target.closest&&e.target.closest('.oesel-l'))return;closeAll();},true);
  const run=()=>document.querySelectorAll('select:not(.oesel-n)').forEach(enh);
  new MutationObserver(run).observe(document.documentElement,{childList:true,subtree:true});
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run);else run();
})();

/* drifting particle network behind every AI tab, chat included. Light on CPU:
   ~30 fps, fewer points on phones, stops when the tab is hidden or motion is reduced. */
function netStart(cv){
  if(!cv||REDUCED)return;
  const cx=cv.getContext('2d');let W=0,H=0,P=[],last=0;
  const fit=()=>{const r=Math.min(window.devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;cv.width=W*r;cv.height=H*r;cx.setTransform(r,0,0,r,0,0);
    const n=W<700?28:Math.min(70,Math.round(W*H/26000));P=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,r:Math.random()*1.6+.6,ph:Math.random()*6.3}));};
  fit();addEventListener('resize',fit);
  const L=W<700?110:150;
  const step=t=>{requestAnimationFrame(step);if(document.hidden||t-last<33)return;last=t;
    if(!cv.parentNode||!cv.parentNode.classList.contains('on'))return;
    cx.clearRect(0,0,W,H);
    for(const p of P){p.x+=p.vx;p.y+=p.vy;if(p.x<-20)p.x=W+20;if(p.x>W+20)p.x=-20;if(p.y<-20)p.y=H+20;if(p.y>H+20)p.y=-20;}
    for(let i=0;i<P.length;i++){const a=P[i];for(let j=i+1;j<P.length;j++){const b=P[j],dx=a.x-b.x,dy=a.y-b.y,q=dx*dx+dy*dy;if(q<L*L){cx.strokeStyle=`rgba(34,240,138,${(1-Math.sqrt(q)/L)*.16})`;cx.lineWidth=1;cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke();}}}
    for(const p of P){const g=.45+.35*Math.sin(t/900+p.ph);cx.fillStyle=`rgba(34,240,138,${g})`;cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.283);cx.fill();}
  };
  requestAnimationFrame(step);
}

async function getQuote(v){
  if(DEMO){toast('Preview mode');return;}

  try{QUOTE=await api('/v1/ai/quote',{method:'POST',body:JSON.stringify({usd:n})});$('#topup').innerHTML=topupBox();bind();quoteTick();}
  catch(e){toast(e.message);}
}
function quoteTick(){
  clearInterval(QT_TIMER);
  QT_TIMER=setInterval(()=>{const el=$('#qLeft');if(!QUOTE){clearInterval(QT_TIMER);return;}
    const left=QUOTE.exp*1000-Date.now();
    if(left<=0){if($('#topup')){$('#topup').innerHTML=topupBox();bind();}clearInterval(QT_TIMER);return;}
    if(el)el.textContent=Math.floor(left/60000)+':'+String(Math.floor(left/1000)%60).padStart(2,'0');},1000);

async function qPay(){
  const eth=window.OE_ETH||await oeWallet();if(!eth||!QUOTE)return;
  const w=$('#qWait');
  try{
    const [from]=await eth.request({method:'eth_requestAccounts'});
    try{await eth.request({method:'wallet_switchEthereumChain',params:[{chainId:QUOTE.chain_id_hex}]});}
    catch(e){if(e&&(e.code===4902||/unrecognized|not been added/i.test(e.message||''))){
      await eth.request({method:'wallet_addEthereumChain',params:[{chainId:QUOTE.chain_id_hex,chainName:'Robinhood Chain',nativeCurrency:{name:'Ether',symbol:'ETH',decimals:18},rpcUrls:[QUOTE.rpc],blockExplorerUrls:QUOTE.explorer?[QUOTE.explorer]:[]}]});}
      else throw e;}
    if(w)w.textContent='Confirm the transfer in your wallet.';
    const tx=await eth.request({method:'eth_sendTransaction',params:[{from,to:QUOTE.token,data:QUOTE.data,value:'0x0'}]});
    if(w)w.innerHTML='Sent. Waiting for it to land, usually under a minute.'+(QUOTE.explorer?` <a href="${E(QUOTE.explorer)}/tx/${E(tx)}" target="_blank" rel="noopener">View</a>`:'');
    waitCredit();
  }catch(e){if(w)w.textContent='';toast(e&&e.code===4001?'You cancelled the transfer':'Could not send: '+((e&&e.message)||e));}
}
function waitCredit(){
  const before=(ME&&ME.balance&&ME.balance.usd)||0;let n=0;
  const t=setInterval(async()=>{n++;
    try{const r=await api('/v1/ai/deposits/check',{method:'POST',body:'{}'});
      if(r.balance_usd>before+0.0001){clearInterval(t);QUOTE=null;toast('Top up arrived: +'+usd(r.balance_usd-before));await load();return;}}catch(e){}
    if(n>30)clearInterval(t);},10000);
}

async function cmpSend(text){
  if(!connected()){connect();return;}
  if(CH.att.length){toast('Compare works with text. Remove the images or turn compare off.');return;}
  const hist=CH.msgs.filter(m=>m.role==='user'||m.role==='assistant').filter(m=>!m.err&&m.content).slice(-12).map(m=>({role:m.role,content:m.content}));
  hist.push({role:'user',content:text});
  const blk={role:'compare',k:Date.now(),cols:CH.cmp.map(id=>({model:id,content:'',pending:true}))};
  CH.msgs.push({role:'user',content:text,local:[]},blk);CH.busy=true;render();scrollChat();setRing('thinking');
  await Promise.all(blk.cols.map(async(c,i)=>{
    try{
      const r=await fetch(API+'/v1/ai/chat',{method:'POST',headers:hdr(),body:JSON.stringify({model:c.model,messages:hist,stream:true})});
      if(!r.ok){let j=null;try{j=await r.json();}catch(e){}throw new Error((j&&((j.error&&j.error.message)||j.detail))||('error '+r.status));}
      const rd=r.body.getReader();const dec=new TextDecoder();let buf='';
      for(;;){const {value,done}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let k;
        while((k=buf.indexOf('\n\n'))>=0){const ev=buf.slice(0,k);buf=buf.slice(k+2);
          for(const line of ev.split('\n')){if(!line.startsWith('data: '))continue;const d=line.slice(6).trim();if(d==='[DONE]')continue;let j;try{j=JSON.parse(d);}catch(e){continue;}
            if(j.error){if(!c.content)throw new Error(j.error.message);continue;}
            const dl=j.choices&&j.choices[0]&&j.choices[0].delta;if(dl&&dl.content){c.content+=dl.content;const el=document.querySelector(`#cx${blk.k}_${i} .md`);if(el)el.innerHTML=md(c.content);if(CH.stick)scrollChat();}
            if(j.usage&&j.usage.oddsengine_charged_usd!=null)c.cost=j.usage.oddsengine_charged_usd;}}}
    }catch(e){c.err=true;c.content=e.message||'Something went wrong';}
    c.pending=false;
    if(c.cost&&ME&&ME.balance)ME.balance.usd=Math.max(0,(ME.balance.usd||0)-c.cost);
  }));
  CH.busy=false;setRing('idle');render();scrollChat();
}

      <div class="row"><div class="l"><b>Weather</b><span>${E((MO&&MO.home)?'At '+MO.home:'Tell it where you live in the chat')}</span></div>${sw(br.parts.weather!==false,'data-br="weather"')}</div>
      <div class="row"><div class="l"><b>Calendar</b><span>${(MO&&MO.calendar&&MO.calendar.connected)?'Today from '+E(MO.calendar.name||'your calendar'):'Connect your calendar below'}</span></div>${sw(br.parts.calendar!==false,'data-br="calendar"')}</div>
      <div class="row"><div class="l"><b>Email</b><span>${(MO&&MO.mail&&MO.mail.connected)?'Unread and important mail':'Connect your mailbox below'}</span></div>${sw(br.parts.mail!==false,'data-br="mail"')}</div>
      <div class="row"><div class="l"><b>Your trips</b><span>Traffic on your way to work, the gym, anywhere you go often</span></div>${sw(br.parts.commute!==false,'data-br="commute"')}</div>
      <div class="row"><div class="l"><b>Headlines</b><span>From the news sources you follow</span></div>${sw(br.parts.news!==false,'data-br="news"')}</div>
      <div class="row"><div class="l"><b>Torch rewards</b><span>${E((MO&&MO.torch_profile)?'What you can claim as '+MO.torch_profile:'Tell it your Torch profile name in the chat')}</span></div>${sw(br.parts.rewards!==false,'data-br="rewards"')}</div>
      <div class="row"><div class="l"><b>Engine calls</b><span>Weather calls you can see</span></div>${sw(br.parts.calls,'data-br="calls"')}</div>
      <div class="row"><div class="l"><b>Crypto Edition</b><span>Prices and windows with an edge</span></div>${sw(br.parts.crypto,'data-br="crypto"')}</div>
      <div class="row"><div class="l"><b>Your bags</b><span>Value on Robinhood Chain, change since yesterday</span></div>${sw(br.parts.bags,'data-br="bags"')}</div>
      <div class="row"><div class="l"><b>Moving on Torch</b><span>Launches with the most volume</span></div>${sw(br.parts.moving,'data-br="moving"')}</div>
      <div style="margin-top:12px"><button class="btn btn-sm" data-act="mobrief">Send me one now</button></div>
    </div>
    <div class="card rv"><h3>Reminders, alerts, trips, news</h3><p class="sub">Set them in the chat. It messages you in Telegram when it is time.</p>
      <div class="mem" id="moList">${moList()}</div></div>
    ${moMailCard()}
    ${moModelCard()}
    <div class="card rv"><h3>Memory</h3><p class="sub">What Your Engine remembers about you. Delete anything, any time.</p>
      <div class="row"><div class="l"><b>Remember new things</b><span>${mem.paused?'Paused. Nothing new gets saved.':'On. It saves what matters.'}</span></div>${sw(!mem.paused,'data-mem="pause"')}</div>
      <div class="row"><div class="l"><b>Wallets and bags</b><span>Which chains and tokens you care about</span></div>${sw(mem.cats.wallets!==false,'data-cat="wallets"')}</div>
      <div class="row"><div class="l"><b>Markets you follow</b><span>Cities, coins, tokens</span></div>${sw(mem.cats.markets!==false,'data-cat="markets"')}</div>
      <div class="row"><div class="l"><b>Personal notes</b><span>How you like your answers</span></div>${sw(mem.cats.notes!==false,'data-cat="notes"')}</div>
      <div class="mem" id="memList">${(mem.items||[]).length?mem.items.map(i=>`<div class="it"><p>${E(i.text)}<small>${E(i.cat)}</small></p><button class="x" data-del="${E(i.id)}" aria-label="Delete">×</button></div>`).join(''):'<div class="note">Nothing saved yet.</div>'}</div>
      ${(mem.items||[]).length?'<div style="margin-top:12px"><button class="btn btn-sm btn-red" data-act="wipe">Delete everything</button></div>':''}
    </div>
    ${walletsCard()}
    <div class="card rv d1"><h3>Balance</h3><p class="sub">One balance for Your Engine and OddsEngine AI.</p>
      <div class="credit"><div class="big">${usd(b.usd||0)}</div><span class="note">${b.odds_equiv?'≈ '+Number(b.odds_equiv).toLocaleString('en-US')+' $ODDS today':''}</span></div>
      <div style="margin-top:14px"><button class="btn btn-sm" data-act="toai">Top up</button></div>
    </div>
  </div></section>`;
};

async function moLoad(){
  if(!connected()||DEMO)return;
  try{MO=await api('/v1/engine/agent');MO_LOG=[];
    if(typeof MODELS!=='undefined'&&!MODELS.length&&typeof loadModels==='function')await loadModels();
    if(MO.inbox&&MO.inbox.length)MO.inbox.forEach(x=>toast(x.text.split('\n')[0]));
    if(MO.live&&!FEAT.engine){FEAT.engine=true;}
    const off=-new Date().getTimezoneOffset()/60;if(MO.live&&MO.utc_offset_hours!==off){api('/v1/engine/agent/briefing',{method:'POST',body:JSON.stringify({utc_offset_hours:off})}).then(()=>{MO.utc_offset_hours=off;}).catch(()=>{});}
    if(TAB==='engine')render();}catch(e){}
}
function moScroll(){const l=$('#moLog');if(l)l.scrollTop=l.scrollHeight;}
async function moSend(t){
  if(MO_BUSY)return;if(!connected()){toast('Connect your wallet first');return;}
  if(!MO_LOG.length&&MO&&MO.history)MO_LOG=MO.history.slice();
  MO_LOG.push({role:'user',content:t});MO_BUSY=true;setRing('thinking');$('#moLog').innerHTML=moMsgs();moScroll();
  try{const r=await api('/v1/engine/ask',{method:'POST',body:JSON.stringify({text:t})});
    MO_LOG.push({role:'assistant',content:r.text,cost:r.trial?null:r.cost_usd,tools:r.tools,images:r.images||[],data:r.image_data||[]});
    if(r.trial&&MO&&MO.access){MO.access.trial_left=r.trial_left;}
    if(ME&&ME.balance&&r.balance_usd!=null)ME.balance.usd=r.balance_usd;
    const ag=await api('/v1/engine/agent').catch(()=>null);if(ag){const h=MO_LOG;MO=ag;MO_LOG=h;const l=$('#moList');if(l){l.innerHTML=moList();moBindList();}}
    const me=await api('/v1/engine/me').catch(()=>null);if(me&&ME){ME.memory=me.memory;}
  }catch(e){MO_LOG.push({role:'assistant',content:(e&&e.message)||'Something went wrong.'});}
  MO_BUSY=false;setRing('idle');const l=$('#moLog');if(l){l.innerHTML=moMsgs();moScroll();}
}
function moBindList(){document.querySelectorAll('[data-mrm]').forEach(b=>b.onclick=async()=>{const [kind,id]=b.dataset.mrm.split(':');b.closest('.it').remove();await save('/v1/engine/agent/remove',{kind,id});toast('Removed');});}
const _bind2=bind;
bind=function(){
  _bind2();
  const f=$('#moForm');if(f){const ta=$('#moIn');
    ta.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();f.requestSubmit();}};
    ta.oninput=()=>{ta.style.height='46px';ta.style.height=Math.min(160,ta.scrollHeight)+'px';};
    f.onsubmit=e=>{e.preventDefault();const t=ta.value.trim();if(!t)return;ta.value='';ta.style.height='46px';moSend(t);};moScroll();}
  document.querySelectorAll('[data-sug]').forEach(b=>b.onclick=()=>{const ta=$('#moIn');if(!ta)return;ta.value=b.dataset.sug;ta.focus();});
  const h=$('#moHour');if(h)h.onchange=async()=>{const off=-new Date().getTimezoneOffset()/60;if(await save('/v1/engine/agent/briefing',{hour:+h.value,utc_offset_hours:off})){if(MO)MO.briefing_local_hour=+h.value;toast('Briefing at '+moTime(+h.value));}};
  moBindList();
  document.querySelectorAll('[data-brain]').forEach(b=>b.onclick=async()=>{const k=b.dataset.brain;if(MO&&MO.brain===k)return;if(await save('/v1/engine/agent/models',{brain:k})){if(MO)MO.brain=k;toast('Your Engine now thinks with '+b.querySelector('b').firstChild.textContent.trim());render();}});
  const mt=$('#moTxt');if(mt)mt.onchange=async()=>{if(await save('/v1/engine/agent/models',{text_model:mt.value||'reset'})){if(MO){MO.defaults=MO.defaults||{};MO.defaults.text_model=mt.value||null;}toast(mt.value?'Answers from '+mt.options[mt.selectedIndex].text:'Your Engine picks the model');}};
  const mi=$('#moImg');if(mi)mi.onchange=async()=>{if(await save('/v1/engine/agent/models',{image_model:mi.value})){if(MO){MO.defaults=MO.defaults||{};MO.defaults.image_model=mi.value;}toast('Images from '+mi.options[mi.selectedIndex].text);}};
};
function supportSheet(){
  $('#sheetIn').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h3 style="margin:0;font-family:var(--disp)">Support</h3><button class="x" data-act="closesheet" aria-label="Close">×</button></div>
   <p class="note" style="margin:8px 0 12px">Something broken, a question about your balance, an idea? Write it here. A human reads every message.${connected()?' Your wallet is attached so we can look it up.':''}</p>
   <textarea id="supTx" class="mo-sup" rows="5" maxlength="4000" placeholder="What happened?"></textarea>
   <label class="mo-supf"><input id="supImg" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden><span>+ Add screenshots</span></label><div id="supPrev" class="mo-supp"></div>
   <input id="supCt" class="mo-sup" maxlength="80" placeholder="Telegram @name or email, so we can answer (optional)">
   <div style="margin-top:12px;display:flex;gap:8px;justify-content:flex-end"><button class="btn btn-g" data-act="supsend" type="button">Send</button></div>
   <p class="note" style="margin-top:10px">Faster in Telegram: write /support and your message to the OddsEngine bot.</p>`;
  $('#sheet').classList.add('show');bind();SUP_IMG=[];
  const fi=$('#supImg');if(fi)fi.onchange=async()=>{for(const f of [...fi.files].slice(0,3-SUP_IMG.length)){try{SUP_IMG.push(await supShrink(f));}catch(e){}}fi.value='';$('#supPrev').innerHTML=SUP_IMG.map(u=>`<img src="${u}" alt="Screenshot">`).join('');};
}
let SUP_IMG=[];
function supShrink(f){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.85));};im.onerror=no;im.src=r.result;};r.onerror=no;r.readAsDataURL(f);});}
function supLink(){const f=document.querySelector('footer.wrap div:last-child');if(f&&!f.querySelector('[data-act="support"]')){const a=document.createElement('a');a.href='#';a.dataset.act='support';a.textContent='Support';a.onclick=e=>{e.preventDefault();supportSheet();};f.appendChild(document.createTextNode(' · '));f.appendChild(a);}}
const _act2=act;
act=async function(a){
  if(a==='support'){supportSheet();return;}
  if(a==='supsend'){const t=($('#supTx').value||'').trim();if(t.length<3&&!SUP_IMG.length){toast('Write a few words first');return;}
    try{const r=await api('/v1/support',{method:'POST',body:JSON.stringify({text:t,contact:$('#supCt').value||'',page:location.hash||'/',images:SUP_IMG})});SUP_IMG=[];
      $('#sheetIn').innerHTML='<h3 style="margin:0 0 8px;font-family:var(--disp)">Got it</h3><p class="note">Ticket #'+E(r.ticket)+'. We read every message and get back to you.</p><div style="margin-top:12px;text-align:right"><button class="btn" data-act="closesheet" type="button">Close</button></div>';bind();
    }catch(e){toast(e.message||'Could not send, try again');}
    return;}
  if(a==='moclear'){MO_LOG=[];if(MO)MO.history=[];await save('/v1/engine/agent/clear',{});render();return;}
  if(a==='mobrief'){try{const r=await api('/v1/engine/agent/briefing/now',{method:'POST',body:'{}'});toast(r.sent_to_telegram?'Sent to your Telegram':'Link Telegram to get it on your phone');if(!r.sent_to_telegram){MO_LOG=(MO_LOG.length?MO_LOG:(MO&&MO.history)||[]).concat([{role:'assistant',content:r.text,cost:0}]);render();}}catch(e){toast(e.message);}return;}
  return _act2(a);
};
const _load2=load;
load=async function(){await _load2();supLink();await moLoad();moTabBeta();};

/* ---------- 2.36 email and calendar ---------- */
const MAIL_PROV=[['gmail','Gmail','https://myaccount.google.com/apppasswords','Google account, Security, 2-Step Verification on, then App passwords. Create one called OddsEngine, copy the 16 letters.'],
 ['icloud','iCloud','https://account.apple.com','Apple Account, Sign-In and Security, App-Specific Passwords, create one.'],
 ['gmx','GMX','https://www.gmx.net','GMX settings, POP3 and IMAP: allow access. For 2-factor accounts create an app password.'],
 ['webde','web.de','https://web.de','web.de settings, POP3/IMAP: allow access. For 2-factor accounts create an app password.'],
 ['yahoo','Yahoo','https://login.yahoo.com/account/security','Account security, Generate app password.'],
 ['outlook','Outlook','https://account.microsoft.com/security','Security, Advanced security options, App passwords. Some Microsoft accounts no longer allow this.']];
let MAIL_P='gmail';
const MAIL_PRIV=`<details class="mo-priv"><summary>What happens with your mail</summary><ul>
  <li>Your Engine reads your inbox only when you ask, plus a quick look at sender and subject every 10 minutes for important-mail alerts.</li>
  <li>We do not store your emails. Your chat keeps your last 16 messages, New chat deletes them.</li>
  <li>When you ask about a mail, its text goes to the AI model that writes the answer. Switch on "Sender and subject only" and no mail text is ever read.</li>
  <li>Read only. It can save a draft, it can never send, delete or move anything.</li>
  <li>Your app password is stored encrypted and deleted the moment you disconnect. You can also revoke it in your Google or Apple account at any time.</li></ul></details>`;
function moMailCard(){
  const m=(MO&&MO.mail)||{},c=(MO&&MO.calendar)||{};const p=MAIL_PROV.find(x=>x[0]===MAIL_P)||MAIL_PROV[0];
  const mailBox=m.connected?`<div class="row"><div class="l"><b>${E(m.email)}</b><span>${m.error?E(m.error):'Connected. Read only, drafts allowed, never sends or deletes.'}</span></div><button class="btn btn-sm" data-act="mailoff">Disconnect</button></div>
      <div class="row"><div class="l"><b>Important mail right away</b><span>Bills, payments, deadlines, security mails in Telegram</span></div>${sw(m.watch!==false,'data-mailwatch="1"')}</div>
      <div class="row"><div class="l"><b>Sender and subject only</b><span>Your Engine never reads the text of a mail. Alerts and the briefing still work.</span></div>${sw(!!m.headers_only,'data-mailhead="1"')}</div>
      ${MAIL_PRIV}`
    : m.available===false?`<p class="note">Email switches on soon.</p>`
    : `<div class="mo-mail"><div class="row"><div class="l"><b>Provider</b><span>Use an app password, not your normal password</span></div><select id="mailProv" class="mo-sel">${MAIL_PROV.map(x=>`<option value="${x[0]}" ${x[0]===MAIL_P?'selected':''}>${x[1]}</option>`).join('')}</select></div>
      <p class="note">${E(p[3])} <a href="${p[2]}" target="_blank" rel="noopener">Open ${E(p[1])}</a></p>
      <input id="mailAdr" type="email" autocomplete="email" placeholder="you@${p[0]==='webde'?'web.de':p[0]==='icloud'?'icloud.com':p[0]+'.com'}" aria-label="Email address">
      <input id="mailPw" type="password" autocomplete="off" placeholder="App password" aria-label="App password">
      <button class="btn btn-g btn-sm" data-act="mailon">Connect mailbox</button>
      ${MAIL_PRIV}</div>`;
  const calBox=c.connected?`<div class="row"><div class="l"><b>${E(c.name||'Calendar')}</b><span>Read only. Reminders before events, with traffic when a place is set.</span></div><button class="btn btn-sm" data-act="caloff">Disconnect</button></div>`
    : `<div class="mo-mail"><p class="note">Paste the secret iCal address. Google Calendar: Settings, your calendar, Secret address in iCal format. iCloud: share the calendar as public. Outlook: Settings, Shared calendars, Publish, ICS link.</p>
      <input id="calUrl" type="url" placeholder="https://… or webcal://…" aria-label="Calendar link">
      <button class="btn btn-g btn-sm" data-act="calon">Connect calendar</button></div>`;
  return `<div class="card rv"><h3>Email and calendar</h3><p class="sub">Ask "what's new in my inbox", "draft a reply to the bank", "what's on tomorrow". Both show up in your morning briefing.</p>
    <h4 class="mo-h4">Email</h4>${mailBox}<h4 class="mo-h4">Calendar</h4>${calBox}</div>`;
}
const _bind3=bind;
bind=function(){
  _bind3();
  const mp=$('#mailProv');if(mp)mp.onchange=()=>{MAIL_P=mp.value;render();};
  document.querySelectorAll('[data-mailhead]').forEach(b=>b.onclick=async()=>{const on=!b.classList.contains('on');try{await api('/v1/engine/agent/mail',{method:'POST',body:JSON.stringify({headers_only:on})});b.classList.toggle('on',on);if(MO&&MO.mail)MO.mail.headers_only=on;toast(on?'Only sender and subject from now on':'Your Engine can read mail text when you ask');}catch(e){toast('Could not save: '+e.message);}});
  document.querySelectorAll('[data-mailwatch]').forEach(b=>b.onclick=async()=>{const on=!b.classList.contains('on');try{await api('/v1/engine/agent/mail',{method:'POST',body:JSON.stringify({watch:on})});b.classList.toggle('on',on);if(MO&&MO.mail)MO.mail.watch=on;toast(on?'Important mail goes to Telegram':'Mail alerts off');}catch(e){toast('Could not save: '+e.message);}});
};
const _act3=act;
act=async function(a,el){
  if(a==='mailon'){const email=($('#mailAdr')||{}).value||'',pw=($('#mailPw')||{}).value||'';if(!email||!pw){toast('Email and app password');return;}
    try{const r=await api('/v1/engine/agent/mail',{method:'POST',body:JSON.stringify({provider:MAIL_P,email,password:pw})});if(MO)MO.mail=r.mail;toast('Mailbox connected');render();}catch(e){toast(e.message);}return;}
  if(a==='mailoff'){if(!(await ask('Your Engine forgets the app password right away. You can also delete the app password in your account.',{title:'Disconnect mailbox?',ok:'Disconnect'})))return;
    try{await api('/v1/engine/agent/mail',{method:'POST',body:JSON.stringify({disconnect:true})});if(MO)MO.mail={connected:false,available:true};toast('Mailbox disconnected');render();}catch(e){toast(e.message);}return;}
  if(a==='calon'){const url=($('#calUrl')||{}).value||'';if(!url){toast('Paste the calendar link');return;}
    try{const r=await api('/v1/engine/agent/calendar',{method:'POST',body:JSON.stringify({url})});if(MO)MO.calendar=r.calendar;toast('Calendar connected');render();}catch(e){toast(e.message);}return;}
  if(a==='caloff'){try{await api('/v1/engine/agent/calendar',{method:'POST',body:JSON.stringify({disconnect:true})});if(MO)MO.calendar={connected:false};toast('Calendar disconnected');render();}catch(e){toast(e.message);}return;}
  return _act3(a,el);
};

/* ---------- load ---------- */
function adminBar(){if($('.admin-bar'))return;const b=document.createElement('div');b.className='admin-bar';b.textContent=DEMO?'Preview with example data. Nothing here is real.':'Operator view. Only you see this view. Visitors see Chat, Models and Account only when the ai switch is on.';document.body.appendChild(b);}
async function loadModels(){try{const d=await api('/v1/ai/models');MODELS=d.models||[];if(d.markup!=null)MARKUP=d.markup;}catch(e){MODELS=[];}}
async function load(){
  const pm=MODELS.length?null:loadModels();
  try{const d=await api('/v1/features');FEAT.engine=!!(d.features&&d.features.engine);FEAT.ai=!!(d.features&&d.features.ai);if(d.admin)PREVIEW=true;}catch(e){}
  ME=null;
  if(TOKEN){try{ME=await api('/v1/engine/me');}catch(e){if(e.status===401){TOKEN='';try{localStorage.removeItem('oe_engine');}catch(_){}}ME=null;}}
  if(DEMO)ME=JSON.parse(JSON.stringify(DEMO_ME));
  if(PREVIEW&&ADMIN){try{ADM=await api('/v1/admin/ai');}catch(e){ADM=null;}}
  if(ME&&ME.ai&&ME.ai.markup!=null)MARKUP=ME.ai.markup;
  if(pm)await pm;
  if(!location.hash&&!FEAT.engine&&FEAT.ai&&TAB==='engine')TAB='models';
  if(ME&&!DEMO){await chatLoadList();}
  if(DEMO||PREVIEW)adminBar();
  render();
  if(LINK)pollLink();
}
load();
setInterval(async()=>{if(document.hidden||!TOKEN||DEMO)return;try{const m=await api('/v1/engine/me');const before=ME&&ME.balance&&ME.balance.usd;ME=m;if(m.balance&&before!=null&&m.balance.usd>before+0.0001){toast('Top up arrived: +'+usd(m.balance.usd-before));render();}}catch(e){}},45000);

</script>
